<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#172A77">
<title>Owners' Answers | Al-Masar</title>
<link rel="icon" href="assets/symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Beiruti:wght@400;500;600;700;800;900&display=swap">
<style>
/* Consultant-only results board. Same identity as the survey: navy stages with the link pattern,
   gold = the path (consensus, the plan line), white grouped panels on a cool ground.
   Built to answer the owners' three questions first: cost, time, how the work runs. */
:root{
  --ground:#F1F2F7;--group:#FFFFFF;--ink:#121833;--ink2:#4C5374;--ink3:#7E84A3;--sep:#E3E5EE;--soft:#F6F7FC;
  --navy:#172A77;--navy-press:#0C1749;--sel:#EEF0F8;--gold:#EAA918;--gold-soft:#FBF1D9;--gold-ink:#7A5400;
  --good:#1F7A4D;--good-bg:#E7F4ED;--warn:#8A5A00;--warn-bg:#FFF4DB;--bad:#B42318;--bad-bg:#FDECEA;
  --r:18px;--r-stage:28px;
  --font:"Beiruti",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-expo:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.76,0,.24,1);
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16.5px;line-height:1.55;word-spacing:.12em;-webkit-font-smoothing:antialiased}
button,input,select,textarea,a{font:inherit;color:inherit;word-spacing:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-size:1.04em}
.num{font-variant-numeric:tabular-nums}

/* app bar */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);box-shadow:0 1px 0 var(--sep)}
.appbar-in{max-width:1240px;margin:0 auto;height:64px;padding-inline:20px;display:flex;align-items:center;gap:12px}
.appbar img{height:32px;display:block}
.appbar .ttl{font-weight:800;font-size:16px;color:var(--ink2);padding-inline-start:14px;margin-inline-start:2px;border-inline-start:1px solid var(--sep);line-height:1.2}
.appbar .ttl small{display:block;font-weight:500;font-size:13px;color:var(--ink3)}
.sp{flex:1}
.seg{display:inline-flex;background:var(--ground);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:36px;padding:0 13px;font-size:14.5px;font-weight:700;cursor:pointer;color:var(--ink2);transition:background .18s ease,color .18s ease}
.seg button[aria-pressed="true"]{background:var(--group);color:var(--navy);box-shadow:0 1px 2px rgba(18,24,51,.14)}
.iconbtn{border:0;background:transparent;min-width:44px;min-height:44px;border-radius:12px;display:inline-grid;place-items:center;color:var(--navy);cursor:pointer;transition:background .18s ease}
.iconbtn:hover{background:var(--ground)}
.iconbtn svg{width:21px;height:21px}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu{position:absolute;inset-inline-end:16px;top:60px;background:var(--group);border-radius:16px;box-shadow:0 14px 36px rgba(18,24,51,.2);min-width:230px;padding:6px;z-index:40;animation:pop .22s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.menu button{display:block;width:100%;border:0;background:transparent;text-align:start;min-height:46px;padding:0 12px;border-radius:12px;font-size:15.5px;font-weight:600;cursor:pointer}
.menu button:hover{background:var(--ground)}

main{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.reveal>*{opacity:0;transform:translateY(16px);animation:fadeup .6s var(--ease-out) forwards}
.reveal>*:nth-child(1){animation-delay:.02s}.reveal>*:nth-child(2){animation-delay:.08s}.reveal>*:nth-child(3){animation-delay:.14s}.reveal>*:nth-child(4){animation-delay:.2s}.reveal>*:nth-child(5){animation-delay:.26s}.reveal>*:nth-child(n+6){animation-delay:.3s}
@keyframes fadeup{to{opacity:1;transform:none}}

/* stage (hero) */
.stage{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:var(--r-stage);padding:34px 36px 64px;isolation:isolate;margin-bottom:22px}
.stage .pat{position:absolute;inset:0;background:url(assets/pattern_navy.png) center/cover no-repeat;z-index:-1;transform:scale(1.06);animation:breathe 26s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1.06) translate3d(-1.2%,-1%,0)}to{transform:scale(1.12) translate3d(1.2%,1%,0)}}
.stage .pathline{position:absolute;inset-inline:0;bottom:0;width:100%;height:90px;z-index:-1}
.stage .pathline path{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 2s var(--ease-io) .2s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.hero-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap}
.stage h1{margin:0 0 6px;font-size:clamp(30px,3.4vw,44px);font-weight:900;line-height:1.1}
.stage .lede{margin:0;color:#D7DCF2;font-size:17.5px;max-width:58ch}
.people{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;line-height:1;border:2px solid rgba(255,255,255,.85)}
.av.sm{width:26px;height:26px;font-size:11px;border-width:1.5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px}
.stat{background:rgba(255,255,255,.09);border-radius:16px;padding:14px 16px}
.stat .k{font-size:14px;color:#C9CFEA;font-weight:600}
.stat .v{font-size:32px;font-weight:900;line-height:1.15;margin-top:2px}
.stat .v small{font-size:16px;font-weight:700;color:#C9CFEA}
.demo{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;border-radius:999px;padding:4px 14px;font-size:14px;margin-bottom:14px}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--group);border-radius:14px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:22px}
.tabs button{border:0;background:transparent;border-radius:11px;min-height:42px;padding:0 18px;font-weight:800;font-size:15.5px;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:background .2s ease,color .2s ease}
.tabs button[aria-selected="true"]{background:var(--navy);color:#fff}

/* panels */
.h2{font-size:24px;font-weight:900;margin:34px 0 4px;line-height:1.2}
.h2+.sub{color:var(--ink2);margin:0 0 14px}
.panel{background:var(--group);border-radius:var(--r);padding:20px 22px;min-width:0}
.panel h3{margin:0 0 4px;font-size:18px;font-weight:800}
.panel .q3{color:var(--ink3);font-size:14.5px;margin:0 0 14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.three .panel{display:flex;flex-direction:column}
.big{font-size:26px;font-weight:900;color:var(--navy);line-height:1.2;margin:2px 0 4px}
.big.ar{font-size:27px}
.mini{font-size:14px;color:var(--ink2)}
.kv{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--sep)}
.kv>div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.kv .k{color:var(--ink2);font-size:14.5px}
.kv .v{font-weight:800;text-align:end}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--sel);color:var(--navy)}

/* range chart (budget) */
.range{position:relative;margin:18px 0 4px;padding-top:4px}
.range .axis{position:relative;height:10px;background:var(--sel);border-radius:6px}
.range .ticks{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);margin-top:6px}
.range .lane{position:relative;height:30px;margin-bottom:6px}
.range .seg2{position:absolute;top:5px;height:20px;border-radius:10px;background:var(--navy);opacity:.9;transform-origin:left center;transform:scaleX(0);transition:transform .9s var(--ease-expo)}
.range .seg2.dep{background:repeating-linear-gradient(90deg,var(--ink3) 0 6px,transparent 6px 10px);opacity:.5}
.range .seg2 .av{position:absolute;top:-3px;inset-inline-start:-4px}
.range .common{position:absolute;top:-4px;bottom:-4px;background:var(--gold);opacity:.22;border-radius:6px}
.go .range .seg2{transform:none}

/* timeline (time) */
.tl{position:relative;margin:22px 4px 8px;height:76px}
.tl .line{position:absolute;inset-inline:0;top:38px;height:4px;background:var(--sel);border-radius:3px}
.tl .early{position:absolute;top:36px;height:8px;border-radius:4px;background:var(--gold);inset-inline-start:0;width:0;transition:width 1s var(--ease-expo) .2s}
.go .tl .early{width:var(--w)}
.tl .st{position:absolute;top:31px;width:18px;height:18px;margin-inline-start:-9px;border-radius:50%;background:var(--group);border:3px solid var(--sel)}
.tl .lb{position:absolute;top:56px;transform:translateX(-50%);font-size:13px;color:var(--ink2);white-space:nowrap;font-weight:600}
.tl .who{position:absolute;top:0;transform:translateX(-50%);display:flex;gap:2px}
.tl .who .av{opacity:0;transform:translateY(-8px);transition:opacity .4s ease,transform .5s var(--ease-out)}
.go .tl .who .av{opacity:1;transform:none}

/* findings */
.find{display:grid;gap:10px}
.f{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--group)}
.f .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.f .ic svg{width:17px;height:17px}
.f.good .ic{background:var(--good-bg);color:var(--good)}.f.warn .ic{background:var(--warn-bg);color:var(--warn)}.f.bad .ic{background:var(--bad-bg);color:var(--bad)}.f.info .ic{background:var(--sel);color:var(--navy)}
.f b.t{display:block;font-weight:800;font-size:16.5px;margin-bottom:2px}
.f .d{color:var(--ink2)}
.f .d b{color:var(--ink)}

/* agreement map */
.agree-list{display:grid;gap:4px}
.ag{display:grid;grid-template-columns:44px minmax(0,1.2fr) minmax(0,1.6fr) 52px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--sep);cursor:pointer;background:none;border-inline:0;border-top:0;text-align:start;width:100%}
.ag:last-child{border-bottom:0}
.ag:hover .lbl{color:var(--navy)}
.ag .id{font-weight:800;color:var(--gold-ink)}
.ag .lbl{font-weight:700;transition:color .18s ease}
.ag .tr{height:10px;background:var(--sel);border-radius:6px;overflow:hidden}
.ag .tr i{display:block;height:100%;width:0;border-radius:6px;transition:width .9s var(--ease-expo)}
.ag .pc{font-weight:800;text-align:end}
.lv-good i{background:var(--good)}.lv-warn i{background:var(--gold)}.lv-bad i{background:var(--bad)}

/* question cards */
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.qc{scroll-margin-top:90px;transition:box-shadow .4s ease}
.qc.flash{box-shadow:0 0 0 3px var(--gold)}
.qc h4{margin:0 0 4px;font-size:16.5px;line-height:1.4;font-weight:800}
.qc .qid{color:var(--gold-ink);font-weight:900;margin-inline-end:8px}
.qc .meta{font-size:13.5px;color:var(--ink3);margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.opt{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 28px;gap:12px;align-items:center;padding:6px 0}
.opt .lbl{font-size:14.5px;line-height:1.35}
.opt .tr{height:16px;background:var(--soft);border-radius:8px;overflow:hidden;position:relative}
.opt .tr i{display:block;height:100%;width:0;background:#9AA5D6;border-radius:8px;transition:width .9s var(--ease-expo)}
.opt.top .tr i{background:var(--gold)}
.opt.top .lbl{font-weight:800}
.opt .n{font-weight:900;text-align:end;color:var(--navy)}
.opt .whos{grid-column:1/-1;display:flex;gap:4px;margin-top:-2px}
.texts{display:grid;gap:10px}
.tx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.tx .by{font-size:13px;color:var(--ink3);font-weight:700}
.tx .t{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--ink3)}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px}
.sec-h h2{margin:0;font-size:22px;font-weight:900}
.sec-h span{color:var(--ink3);font-weight:700}

/* compare matrix */
.mx-wrap{background:var(--group);border-radius:var(--r);overflow:auto;max-height:76vh}
table.mx{border-collapse:separate;border-spacing:0;width:100%;min-width:720px;font-size:14.5px}
.mx th,.mx td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--sep)}
.mx thead th{position:sticky;top:0;background:var(--group);z-index:2;font-weight:800;box-shadow:0 1px 0 var(--sep)}
.mx thead th .ph{display:flex;gap:8px;align-items:center}
.mx tbody th{position:sticky;inset-inline-start:0;background:var(--group);z-index:1;font-weight:700;min-width:210px;max-width:260px}
.mx tbody th .id{color:var(--gold-ink);font-weight:900;margin-inline-end:6px}
.mx tr.sec td,.mx tr.sec th{background:var(--soft);font-weight:900;color:var(--navy);font-size:15px}
.mx td.diff{background:var(--warn-bg)}
.mx td.none{color:var(--ink3)}
.mx td .t{white-space:pre-wrap;overflow-wrap:anywhere}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin:0 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:6px}

/* person */
.pp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pp button{display:flex;gap:10px;align-items:center;border:0;background:var(--group);border-radius:999px;padding:5px 16px 5px 5px;min-height:46px;cursor:pointer;font-weight:700;transition:background .2s ease,color .2s ease}
.pp button .av{border-color:#fff}
.pp button[aria-pressed="true"]{background:var(--navy);color:#fff}
.phead{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle.f2{transition:stroke-dashoffset 1.1s var(--ease-expo)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:900}
.ans{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 22px;padding:11px 0;border-bottom:1px solid var(--sep)}
.ans:last-child{border-bottom:0}
.ans .q{color:var(--ink2);font-size:14.5px}
.ans .q b{color:var(--gold-ink);margin-inline-end:6px}
.ans .a{font-weight:800;white-space:pre-wrap;overflow-wrap:anywhere}
.ans .a.none{color:var(--ink3);font-weight:400}
.ans .a .tagm{display:inline-block;margin-inline-start:8px;font-size:12px;font-weight:800;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:1px 8px;vertical-align:1px}
.stack{display:grid;gap:16px}

/* connect */
.conn{max-width:620px;margin:10px auto}
.conn .stage{padding:34px}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-weight:800;font-size:14px;color:#D7DCF2}
.field input{border:0;border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);width:100%}
.btn{border:0;border-radius:999px;min-height:48px;padding:0 24px;font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .18s ease,transform .14s var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--gold);color:var(--navy)}
.btn.o{background:rgba(255,255,255,.12);color:#fff}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:700;margin-top:14px}
.loading{display:grid;place-items:center;padding:80px 0;color:var(--ink2);gap:14px}
.loading svg{width:120px}
.loading path{stroke-dasharray:1;stroke-dashoffset:1;animation:dashloop 1.6s var(--ease-io) infinite}
@keyframes dashloop{0%{stroke-dashoffset:1}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}

@media (max-width:1000px){.three{grid-template-columns:1fr}.qgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .appbar-in{padding-inline:12px;gap:6px}.appbar .ttl{display:none}.appbar img{height:28px}
  main{padding:14px 14px 70px}.stage{padding:24px 20px 22px;border-radius:22px}
  .ag{grid-template-columns:36px minmax(0,1fr) 46px}.ag .tr{grid-column:2/4;grid-row:2}
  .ans{grid-template-columns:1fr}.opt{grid-template-columns:minmax(0,1fr) 90px 24px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;transition-duration:1ms!important}.stage .pat{animation:none}}
@media print{
  body{background:#fff;font-size:11pt}.appbar,.tabs,.no-print{display:none!important}
  main{padding:0;max-width:none}.stage{background:#fff;color:var(--ink);border:2px solid var(--navy);padding:16px}.stage .pat,.stage .pathline{display:none}
  .stage .lede,.stat .k,.stat .v small{color:var(--ink2)}.stat{background:var(--soft)}.av{border-color:#fff}
  .panel,.f,.qc{break-inside:avoid;border:1px solid var(--sep)}.reveal>*{opacity:1!important;transform:none!important;animation:none!important}
  .mx-wrap{max-height:none;overflow:visible}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <img src="assets/horiz.png" alt="Al-Masar Insurance">
    <div class="ttl">Owners' answers<small>Private consultant view</small></div>
    <div class="sp"></div>
    <div class="seg no-print" role="group" aria-label="Answer language">
      <button type="button" id="l_en">English</button>
      <button type="button" id="l_ar" lang="ar">عربي</button>
    </div>
    <button class="iconbtn" type="button" id="refresh" title="Refresh answers" aria-label="Refresh answers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    <button class="iconbtn" type="button" id="exportBtn" title="Export" aria-label="Export" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
  </div>
  <div class="menu" id="menu" role="menu" hidden>
    <button type="button" role="menuitem" id="prt">Print or save as PDF</button>
    <button type="button" role="menuitem" id="csv">Download spreadsheet (CSV)</button>
    <button type="button" role="menuitem" id="json">Download raw data (JSON)</button>
    <button type="button" role="menuitem" id="disc">Disconnect this device</button>
  </div>
</header>
<main id="main"></main>

<script src="questions.js"></script>
<script src="config.js"></script>
<script>
(function(){
const SV=window.SURVEY,CFG=window.SURVEY_CONFIG||{};
const LS="almasar-dashboard-conn",LSV="almasar-dashboard-view";
const ALLQ=[];SV.sections.forEach(s=>s.q.forEach(q=>{q.sec=s;ALLQ.push(q)}));
const QI=Object.fromEntries(ALLQ.map(q=>[q.id,q]));
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
let conn={};try{conn=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){}
const hp=new URLSearchParams(location.hash.slice(1));
if(hp.get("key")){conn.key=hp.get("key");try{localStorage.setItem(LS,JSON.stringify(conn))}catch(e){};history.replaceState(null,"",location.pathname+location.search)}
const demo=new URLSearchParams(location.search).get("demo")==="1";
let saved={};try{saved=JSON.parse(localStorage.getItem(LSV)||"{}")||{}}catch(e){}
let R=undefined,L=saved.L===1?1:0,view=saved.view||"plan",person=null,err="";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tx=a=>`<span class="${L?"ar":""}" ${L?'lang="ar" dir="rtl"':""}>${esc(a[L])}</span>`;
const endpoint=()=>conn.endpoint||CFG.endpoint||"";
const keep=()=>{try{localStorage.setItem(LSV,JSON.stringify({L,view}))}catch(e){}};

const DEMO=[

const COLORS=["#172A77","#C98A00","#3F55B5","#0E7C66","#8B3A62","#5B6478","#B4532A","#2F6F9F"];
function initials(n){const w=String(n||"?").trim().split(/\s+/).filter(Boolean);return ((w[0]||"?")[0]+(w.length>1?w[w.length-1][0]:"")).toUpperCase()}
let PC={};
const av=(r,sm)=>`<span class="av ${sm?"sm":""}" style="background:${PC[r.id]||COLORS[0]}" title="${esc(r.name)}${r.role?" · "+esc(r.role):""}" aria-label="${esc(r.name)}">${esc(initials(r.name))}</span>`;
const nm=r=>esc(String(r.name||"?").trim());
const names=a=>a.map(nm).join(", ");
function ansText(q,a,lang){const v=a[q.id];let s="";
  if(q.type==="single")s=v!=null&&q.o[v]?q.o[v][lang]:"";
  else if(q.type==="multi")s=Array.isArray(v)?v.map(i=>q.o[i]&&q.o[i][lang]).filter(Boolean).join(lang?"، ":", "):"";
  else s=v||"";
  if(q.comment&&a[q.id+"_c"])s+=(s?" — ":"")+a[q.id+"_c"];return s}
const has=(q,a)=>{const v=a[q.id];return q.type==="single"?v!=null:q.type==="multi"?Array.isArray(v)&&v.length>0:!!(v&&String(v).trim())};
const by=(rows,id,i)=>rows.filter(r=>{const v=r.answers[id];return Array.isArray(v)?v.includes(i):v===i});
const answered=(rows,id)=>rows.filter(r=>has(QI[id],r.answers));
function dist(q,rows){const c=q.o.map(()=>[]);rows.forEach(r=>{const v=r.answers[q.id];if(q.type==="single"&&v!=null&&c[v])c[v].push(r);if(q.type==="multi"&&Array.isArray(v))v.forEach(i=>c[i]&&c[i].push(r))});return c}
function topOpt(q,rows){const c=dist(q,rows);let b=-1,n=0,tie=false;c.forEach((x,i)=>{if(x.length>n){n=x.length;b=i;tie=false}else if(x.length===n&&n>0)tie=true});return {i:b,n,tie,c}}
function agreement(q,rows){const ans=rows.filter(r=>has(q,r.answers));if(ans.length<2)return null;
  if(q.type==="single"){const c=dist(q,ans);return Math.max(...c.map(x=>x.length))/ans.length}
  let s=0,n=0;for(let i=0;i<ans.length;i++)for(let j=i+1;j<ans.length;j++){const a=new Set(ans[i].answers[q.id]),b=new Set(ans[j].answers[q.id]);const inter=[...a].filter(x=>b.has(x)).length;const uni=new Set([...a,...b]).size;s+=uni?inter/uni:1;n++}
  return n?s/n:null}
const lvl=p=>p>=.75?"good":p>=.5?"warn":"bad";
const fmtK=n=>n>=1000?(n/1000).toLocaleString("en")+"k":String(n);
const ICON={good:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',warn:'<path d="M12 8v5M12 16.5v.5"/>',bad:'<path d="M12 7v6M12 16.5v.5"/>',info:'<path d="M12 11v6M12 7.5v.5"/>'};
const f=(lv,t,d)=>({lv,t,d});
const fHTML=F=>`<div class="find">${F.map(x=>`<div class="f ${x.lv}"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[x.lv]}</svg></span><div><b class="t">${x.t}</b><div class="d">${x.d}</div></div></div>`).join("")}</div>`;

/* ---------- loading ---------- */
async function load(){
  err="";
  if(demo){R=DEMO;prep();render();return}
  if(!endpoint()||!conn.key){R=null;render();return}
  if(R===undefined)$("#main").innerHTML=`<div class="loading">${loopSvg()}<div>Loading the owners' answers…</div></div>`;
  $("#refresh").classList.add("spin");
  try{
    const r=await fetch(endpoint()+(endpoint().includes("?")?"&":"?")+"key="+encodeURIComponent(conn.key)+"&t="+Date.now());
    const j=await r.json();
    if(!j.ok||!Array.isArray(j.responses)){R=null;err="The key was not accepted. Copy it again from the Dashboard key tab in your Google Sheet.";}
    else{let rows=j.responses.map(x=>({...x,answers:x.answers||{}})).sort((a,b)=>String(a.receivedAt).localeCompare(String(b.receivedAt)));
      const byName={};rows.forEach(x=>byName[(x.name||"").trim().toLowerCase()]=x);R=Object.values(byName);prep()}
  }catch(e){R=null;err="Could not reach the answer store. Check the connection and that the web app is deployed with access set to Anyone."}
  $("#refresh").classList.remove("spin");render();
}

    if(lo<hi){common=[lo,hi];head=`${fmtK(lo*1000)} – ${fmtK(hi*1000)} LYD`;sub="Every owner who gave a range accepts this band";}
    else{const minHi=Math.min(...num.map(r=>BANDS[r.answers.A1][1]));head=`Up to ${fmtK(minHi*1000)} LYD`;sub="Ranges don't overlap. Use the lowest ceiling for the base plan and show the larger plan as an option.";}
  }else if(dep.length){head="Waiting for our proposal";sub="All who answered said it depends on the plan"}
  const pos=v=>(v-300)/700*100;
  const lanes=a1.map(r=>{const v=r.answers.A1;if(v===4)return `<div class="lane"><div class="seg2 dep" style="inset-inline-start:0;width:100%">${av(r,1)}</div></div>`;
    const [lo,hi]=BANDS[v];return `<div class="lane"><div class="seg2" style="inset-inline-start:${pos(lo)}%;width:${pos(hi)-pos(lo)}%;background:${PC[r.id]}">${av(r,1)}</div></div>`}).join("");
  const range=a1.length?`<div class="range">${lanes}<div class="axis">${common?`<div class="common" style="inset-inline-start:${pos(common[0])}%;width:${pos(common[1])-pos(common[0])}%"></div>`:""}</div><div class="ticks num"><span>300k</span><span>500k</span><span>750k</span><span>1M LYD</span></div></div>`:"";
  const a2=topOpt(QI.A2,answered(rows,"A2")),a3d=dist(QI.A3,answered(rows,"A3"));

/* ---------- findings ---------- */
function findings(rows){
  const F=[];
  const low=by(rows,"A1",0),high=[...by(rows,"A1",2),...by(rows,"A1",3)];
  if(low.length&&high.length)F.push(f("warn","Budget views are far apart",`${names(low)} chose 300–400k while ${names(high)} chose above 500k. Present a base plan and a larger plan side by side.`));
  const disc=by(rows,"A3",2);if(disc.length)F.push(f("warn","6-month commitment needs a conversation",`Want to discuss it: ${names(disc)}. Prepare what is delivered in each of the six months.`));
  else if(answered(rows,"A3").length)F.push(f("good","6-month commitment accepted",`Everyone who answered accepts it${by(rows,"A3",1).length?`; ${names(by(rows,"A3",1))} would commit to the full year`:""}.`));
  const one=by(rows,"B2",0),three=by(rows,"B2",1);
  if(one.length)F.push(f("bad","Expect results within a month",`Chose within 1 month: ${names(one)}. Agree early signs of progress for months 1–3 before the plan starts, or the first month will feel like a failure.`));
  else if(three.length)F.push(f("warn","Expect results within 3 months",`Chose within 3 months: ${names(three)}. Show clear early indicators in the first monthly report.`));
  const none=by(rows,"B4",4);if(none.length)F.push(f("bad","No baseline today",`Said nothing is tracked: ${names(none)}. Set up basic tracking (policies, inquiries, where customers heard about Al-Masar) in month 1, or results can't be proven.`));
  const micro=by(rows,"C1",0),slow=by(rows,"C3",2);
  if(micro.length)F.push(f("warn","Want to approve every post and ad",`Chose this: ${names(micro)}.${slow.length?` Approvals may take up to a week, according to ${names(slow)}.`:""} Propose a monthly content calendar approved in one sitting.`));
  else if(slow.length)F.push(f("warn","Slow approvals",`Approvals may take up to a week, according to ${names(slow)}. Build that into the content schedule.`));
  const noStaff=by(rows,"C5",0),noHire=by(rows,"C6",1);
  if(noStaff.length)F.push(f(noHire.length?"warn":"info","No marketing staff in-house",`According to ${names(noStaff)}.${noHire.length?` No plan to hire, according to ${names(noHire)}, so plan for more hands-on work from our side.`:" Helping them hire and train is a selling point."}`));
  const d2=answered(rows,"D2");if(d2.length>1){const ag=agreement(QI.D2,rows),t=topOpt(QI.D2,d2);F.push(f(ag===1?"good":"warn","Main focus",t.tie?`Owners are split (${Math.round(ag*100)}% agreement). Settle this before the message is written.`:`<b>${esc(QI.D2.o[t.i][0])}</b>${ag===1?", everyone agrees.":` is most chosen, but not by everyone (${Math.round(ag*100)}% agreement).`}`))}
  const d5=answered(rows,"D5");if(d5.length){const ok=dist(QI.D5,d5).map((x,i)=>[x,i]).filter(x=>x[0].length===d5.length&&x[1]!==5).map(x=>esc(QI.D5.o[x[1]][0]));
    F.push(f(ok.length?"good":"warn","What we can say publicly",ok.length?`Everyone approved: <b>${ok.join(", ")}</b>. Anything else needs sign-off before a campaign uses it.`:"No claim is approved by everyone yet. Confirm before any campaign uses one."))}
  const e1=answered(rows,"E1");if(e1.length)F.push(f("info","Their main concerns",e1.map(r=>`<b>${nm(r)}:</b> <span class="ar" dir="rtl">${esc(r.answers.E1)}</span>`).join("<br>")));
  return F;
}

/* ---------- agreement map ---------- */
function agreeMap(rows){
  const list=ALLQ.filter(q=>q.o).map(q=>[q,agreement(q,rows)]).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1]);
  if(!list.length)return `<div class="panel empty">Agreement appears once two or more people answer.</div>`;
  return `<div class="panel"><div class="agree-list">${list.map(([q,a])=>`<button class="ag lv-${lvl(a)}" type="button" data-jump="${q.id}"><span class="id">${q.id}</span><span class="lbl">${esc(q.label)}</span><span class="tr"><i data-w="${Math.round(a*100)}"></i></span><span class="pc num">${Math.round(a*100)}%</span></button>`).join("")}</div></div>`;
}

/* ---------- question cards ---------- */
function qCard(q,rows){
  const ans=rows.filter(r=>has(q,r.answers));let body="",meta=`<span>${ans.length} of ${rows.length} answered</span>`;
  if(q.o){const c=dist(q,ans);const mx=Math.max(1,...c.map(x=>x.length));const top=Math.max(...c.map(x=>x.length));
    body=c.map((x,i)=>`<div class="opt ${x.length&&x.length===top?"top":""}"><div class="lbl">${tx(q.o[i])}</div><div class="tr"><i data-w="${x.length/mx*100}"></i></div><div class="n num">${x.length}</div>${x.length?`<div class="whos">${x.map(r=>av(r,1)).join("")}</div>`:""}</div>`).join("");
    const ag=agreement(q,rows);if(ag!=null)meta+=`<span class="pill ${lvl(ag)}">${Math.round(ag*100)}% agree</span>`;
    if(q.comment){const cm=rows.filter(r=>r.answers[q.id+"_c"]);if(cm.length)body+=`<div class="texts" style="margin-top:12px">`+cm.map(r=>`<div class="tx">${av(r,1)}<div><div class="by">${nm(r)}</div><div class="t ar" dir="auto">${esc(r.answers[q.id+"_c"])}</div></div></div>`).join("")+`</div>`}
  }else body=ans.length?`<div class="texts">`+ans.map(r=>`<div class="tx">${av(r,1)}<div><div class="by">${nm(r)}${r.role?" · "+esc(r.role):""}</div><div class="t ar" dir="auto">${esc(r.answers[q.id])}</div></div></div>`).join("")+`</div>`:`<div class="empty">No answers yet</div>`;
  return `<div class="panel qc" id="q-${q.id}"><h4><span class="qid">${q.id}</span>${tx(q.t)}</h4><div class="meta">${meta}</div>${body}</div>`;
}

/* ---------- compare matrix ---------- */
function compare(rows){
  let h=`<p class="legend"><span><i style="background:var(--warn-bg);outline:1px solid #F1D08A"></i>Differs from the most common answer</span><span>Click a name to open that person</span></p><div class="mx-wrap"><table class="mx"><thead><tr><th>Question</th>${rows.map(r=>`<th><button type="button" class="ph" data-person="${esc(r.id)}" style="border:0;background:none;cursor:pointer;padding:0;font-weight:800">${av(r,1)}<span>${nm(r)}</span></button></th>`).join("")}</tr></thead><tbody>`;
  SV.sections.forEach(s=>{h+=`<tr class="sec"><th colspan="${rows.length+1}">${tx(s.t)}</th></tr>`;
    s.q.forEach(q=>{const t=q.type==="single"?topOpt(q,answered(rows,q.id)):null;
      h+=`<tr><th><span class="id">${q.id}</span>${esc(q.label)}</th>`+rows.map(r=>{const a=ansText(q,r.answers,L);const diff=t&&!t.tie&&t.i>=0&&r.answers[q.id]!=null&&r.answers[q.id]!==t.i&&answered(rows,q.id).length>1;
        return `<td class="${a?"":"none"} ${diff?"diff":""}"><div class="t ${L||!q.o?"ar":""}" dir="auto">${esc(a||"No answer")}</div></td>`}).join("")+`</tr>`})});
  return h+`</tbody></table></div>`;
}

/* ---------- person ---------- */
function personView(rows){
  if(!person||!rows.find(r=>r.id===person))person=rows[0]&&rows[0].id;
  const p=rows.find(r=>r.id===person);if(!p)return "";
  const n=ALLQ.filter(q=>has(q,p.answers)).length,C=2*Math.PI*34;
  const fl=findings([p]).filter(x=>(x.lv==="bad"||x.lv==="warn")&&x.t!=="Main focus");
  const recv=new Date(p.receivedAt);
  let h=`<div class="pp no-print" role="group" aria-label="Choose a person">${rows.map(r=>`<button type="button" data-person="${esc(r.id)}" aria-pressed="${r.id===person}">${av(r)}<span>${nm(r)}</span></button>`).join("")}</div>
  <div class="stack reveal"><div class="panel"><div class="phead"><div class="ring"><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="34" fill="none" stroke="#E3E5EE" stroke-width="8"/><circle class="f2" cx="42" cy="42" r="34" fill="none" stroke="#EAA918" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C*(1-n/ALLQ.length)}"/></svg><b class="num">${n}</b></div>
    <div><div style="font-size:26px;font-weight:900;line-height:1.2">${nm(p)}</div><div class="mini">${esc(p.role||"Role not given")} · answered ${n} of ${ALLQ.length} · ${isNaN(recv)?"":esc(recv.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))} · filled in ${p.lang==="en"?"English":"Arabic"}</div></div></div></div>`;
  if(fl.length)h+=`<div>${fHTML(fl)}</div>`;
  SV.sections.forEach(s=>{h+=`<div class="panel"><h3 style="margin-bottom:6px">${tx(s.t)}</h3>`+s.q.map(q=>{const a=ansText(q,p.answers,L);const t=q.type==="single"?topOpt(q,answered(rows,q.id)):null;const diff=rows.length>1&&t&&!t.tie&&t.i>=0&&p.answers[q.id]!=null&&p.answers[q.id]!==t.i;
    return `<div class="ans"><div class="q"><b>${q.id}</b>${tx(q.t)}</div><div class="a ${a?"":"none"} ${L||!q.o?"ar":""}" dir="auto">${esc(a||"No answer")}${diff?`<span class="tagm">differs from others</span>`:""}</div></div>`}).join("")+`</div>`});
  return h+`</div>`;
}

/* ---------- render ---------- */
function render(){
  const m=$("#main");
  $("#l_en").setAttribute("aria-pressed",L?"false":"true");$("#l_ar").setAttribute("aria-pressed",L?"true":"false");
  if(R===null||R===undefined){m.innerHTML=connectView();$("#go").onclick=()=>{const ep=$("#ep");if(ep)conn.endpoint=ep.value.trim();conn.key=$("#ky").value.trim();try{localStorage.setItem(LS,JSON.stringify(conn))}catch(e){};R=undefined;load()};
    $("#ky").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});return}
  const rows=R;let h=`<div class="reveal">`+hero(rows)+`</div>`;
  if(!rows.length){m.innerHTML=h;go();return}
  const tabs=[["plan","Plan inputs"],["questions","Every question"],["compare","Side by side"],["person","Each person"]];
  h+=`<div class="tabs no-print" role="tablist">${tabs.map(t=>`<button role="tab" type="button" aria-selected="${view===t[0]}" data-v="${t[0]}">${t[1]}</button>`).join("")}</div><div id="body">`;
  if(view==="plan"){
    h+=`<div class="three reveal">${costPanel(rows)}${timePanel(rows)}${workPanel(rows)}</div>
      <h2 class="h2">What to act on</h2><p class="sub">Flags drawn from the answers, most urgent first.</p><div class="reveal">${fHTML(sortF(findings(rows)))}</div>
      <h2 class="h2">Where they agree and disagree</h2><p class="sub">Lowest agreement first. Click a row to open that question.</p><div class="reveal">${agreeMap(rows)}</div>`;
  }else if(view==="questions"){
    SV.sections.forEach(s=>{h+=`<div class="sec-h"><h2>${tx(s.t)}</h2><span>${s.q.length} questions</span></div><div class="qgrid reveal">${s.q.map(q=>qCard(q,rows)).join("")}</div>`});
  }else if(view==="compare")h+=`<div class="reveal">${compare(rows)}</div>`;
  else h+=personView(rows);
  m.innerHTML=h+`</div>`;wireBody();go();
}
function sortF(F){const o={bad:0,warn:1,good:2,info:3};return F.slice().sort((a,b)=>o[a.lv]-o[b.lv])}
function wireBody(){
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;keep();render();window.scrollTo({top:$(".tabs").offsetTop-80,behavior:RM?"auto":"smooth"})});
  document.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>{person=b.dataset.person;view="person";keep();render()});
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{view="questions";keep();render();const el=$("#q-"+b.dataset.jump);if(el){el.scrollIntoView({behavior:RM?"auto":"smooth",block:"start"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600)}});
}
// animate: bars grow, numbers count up, ring fills
function go(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $("#main").classList.add("go");
    document.querySelectorAll("[data-w]").forEach(i=>i.style.width=i.dataset.w+"%");
    document.querySelectorAll(".ring circle.f2").forEach(c=>c.style.strokeDashoffset=c.dataset.to);
    document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count;if(RM||!to){el.textContent=to;return}
      const t0=performance.now(),d=900;const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
  }));
}

/* ---------- export ---------- */
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const closeMenu=()=>{$("#menu").hidden=true;$("#exportBtn").setAttribute("aria-expanded","false")};
$("#exportBtn").onclick=e=>{e.stopPropagation();const m=$("#menu");m.hidden=!m.hidden;$("#exportBtn").setAttribute("aria-expanded",String(!m.hidden))};
document.addEventListener("click",e=>{if(!$("#menu").hidden&&!$("#menu").contains(e.target))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
$("#csv").onclick=()=>{closeMenu();if(!R||!R.length)return;const head=["Name","Role","Received","Language",...ALLQ.map(q=>q.id+" "+q.label)];
  const lines=[head,...R.map(r=>[r.name,r.role,r.receivedAt,r.lang,...ALLQ.map(q=>ansText(q,r.answers,L))])].map(row=>row.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(","));
  download("almasar-owners-answers.csv","﻿"+lines.join("\r\n"),"text/csv;charset=utf-8")};
$("#json").onclick=()=>{closeMenu();if(!R)return;download("almasar-owners-answers.json",JSON.stringify({questions:SV,responses:R},null,2),"application/json")};
$("#prt").onclick=()=>{closeMenu();setTimeout(()=>window.print(),60)};
$("#disc").onclick=()=>{closeMenu();conn={};try{localStorage.removeItem(LS)}catch(e){};R=null;render()};
$("#refresh").onclick=()=>{if(demo){render();return}load()};
$("#l_en").onclick=()=>{L=0;keep();render()};$("#l_ar").onclick=()=>{L=1;keep();render()};
window.addEventListener("hashchange",()=>{if(location.hash.includes("key="))location.reload()});
load();
})();
</script>
</body>
</html>
