<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#172A77">
<title>استبيان رؤية الإدارة | المسار للتأمين</title>
<meta property="og:title" content="استبيان رؤية الإدارة | المسار للتأمين">
<meta property="og:description" content="23 سؤالاً، حوالي 10 دقائق، وإجاباتكم سرية">
<meta property="og:image" content="https://yaseenhamied.github.io/almasar-survey/assets/og.png">
<meta property="og:type" content="website">
<link rel="icon" href="assets/symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Beiruti:wght@400;500;600;700;800&display=swap">
<style>
/* Al-Masar survey. One face (Beiruti). Ground one tone step below the white groups; navy for actions and selection;
   gold only on the journey path, the brand's "path" motif, which is also the progress indicator.
   Phone: one section per screen, sticky bottom bar. Desktop: journey sidebar + 640px reading column. */
:root{
  --ground:#F1F2F7;--group:#FFFFFF;--ink:#121833;--ink2:#4C5374;--ink3:#7E84A3;--sep:#E3E5EE;
  --navy:#172A77;--navy-press:#0F1D57;--sel:#EEF0F8;--gold:#EAA918;--gold-ink:#7A5400;--err:#B42318;--ok:#1F7A4D;
  --r-group:16px;--r-btn:999px;
  --font:"Beiruti",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.55;word-spacing:.08em;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;word-spacing:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--group);padding-top:env(safe-area-inset-top,0px)}
.appbar-in{max-width:1180px;margin:0 auto;height:64px;padding-inline:20px;display:flex;align-items:center;gap:14px}
.appbar img{height:34px;width:auto;display:block}
.appbar .sp{flex:1}
.seg{display:inline-flex;background:var(--ground);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:36px;padding:0 14px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--group);color:var(--ink);box-shadow:0 1px 2px rgba(18,24,51,.12)}
.iconbtn{border:0;background:transparent;min-width:44px;min-height:44px;border-radius:12px;display:inline-grid;place-items:center;color:var(--navy);cursor:pointer}
.iconbtn:hover{background:var(--ground)}
.iconbtn svg{width:22px;height:22px}
.menu{position:absolute;inset-inline-end:16px;top:calc(env(safe-area-inset-top,0px) + 60px);background:var(--group);border-radius:14px;box-shadow:0 12px 32px rgba(18,24,51,.18);min-width:250px;padding:6px;z-index:30}
.menu button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:transparent;text-align:start;min-height:46px;padding:0 12px;border-radius:10px;font-size:16px;cursor:pointer}
.menu button:hover{background:var(--ground)}
.menu small{display:block;color:var(--ink3);font-size:13px;line-height:1.3}

/* layout */
.layout{max-width:1180px;margin:0 auto;padding-inline:20px;display:grid;grid-template-columns:270px minmax(0,640px);gap:64px;justify-content:center;padding-block:40px 80px}
.journey{position:sticky;top:104px;align-self:start}
.journey ol{list-style:none;margin:0;padding:0;position:relative}
.journey li{position:relative;padding-inline-start:40px;min-height:58px}
.journey li::before{content:"";position:absolute;inset-inline-start:13px;top:30px;bottom:-2px;width:3px;border-radius:2px;background:var(--sep)}
.journey li.done::before{background:var(--gold)}
.journey li:last-child::before{display:none}
.journey .dot{position:absolute;inset-inline-start:2px;top:4px;width:25px;height:25px;border-radius:50%;border:3px solid var(--sep);background:var(--ground);display:grid;place-items:center}
.journey li.done .dot{background:var(--gold);border-color:var(--gold)}
.journey li.done .dot::after{content:"";width:6px;height:11px;border:solid var(--navy);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.journey li.cur .dot{border-color:var(--navy);background:var(--group)}
.journey li.cur .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--navy)}
.journey button{border:0;background:transparent;padding:4px 0;text-align:start;cursor:pointer;font-size:17px;line-height:1.35;color:var(--ink2)}
.journey li.cur button{color:var(--ink);font-weight:700}
.journey button:disabled{cursor:default}
.journey .cnt{display:block;font-size:13px;color:var(--ink3)}
.jmini{display:none}

/* screen */
.screen{min-width:0}
.screen.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:40px;line-height:1.15;font-weight:800;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.lede{font-size:19px;color:var(--ink2);margin:0 0 30px;max-width:56ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin:-12px 0 30px;color:var(--ink2);font-size:16px}
.facts b{color:var(--ink)}
.q{border:0;padding:0;margin:0 0 34px;min-width:0}
.q legend,.q .qt{padding:0;font-size:19px;font-weight:700;line-height:1.45;margin-bottom:4px;float:none;width:100%}
.hint{font-size:15px;color:var(--ink3);margin:0 0 10px}
.group{background:var(--group);border-radius:var(--r-group);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;min-height:54px;padding:10px 18px;cursor:pointer;position:relative;font-size:17.5px;line-height:1.4}
.row+.row::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;height:1px;background:var(--sep)}
.row:hover{background:#FAFAFD}
.row:active{background:var(--sel)}
.row input{position:absolute;opacity:0;pointer-events:none}
.row .txt{flex:1;min-width:0}
.row .mk{width:24px;height:24px;flex:none;display:grid;place-items:center}
.row.single .mk svg{width:20px;height:20px;color:var(--navy);opacity:0}
.row.single input:checked~.mk svg{opacity:1}
.row.multi .mk{border:2px solid #B9BED3;border-radius:50%}
.row.multi input:checked~.mk{background:var(--navy);border-color:var(--navy)}
.row.multi .mk svg{width:14px;height:14px;color:#fff;opacity:0}
.row.multi input:checked~.mk svg{opacity:1}
.row:has(input:checked) .txt{font-weight:700;color:var(--navy)}
.row:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:-3px}
.row.off{cursor:not-allowed}.row.off .txt{color:var(--ink3)}
.group textarea,.group input[type=text]{display:block;width:100%;border:0;background:transparent;padding:14px 18px;font-size:17.5px;line-height:1.5;resize:vertical}
.group textarea{min-height:110px}
.group textarea:focus,.group input[type=text]:focus{outline:none;background:#FCFCFE}
.group:has(textarea:focus,input[type=text]:focus){box-shadow:0 0 0 3px rgba(234,169,24,.55)}
.group .sub{border-top:1px solid var(--sep)}
.fieldlbl{display:block;font-size:15px;font-weight:600;color:var(--ink2);padding:12px 18px 0}
.req{color:var(--err)}
.err-msg{color:var(--err);font-size:15px;margin:8px 4px 0}
.why{font-size:17px;color:var(--ink2);margin:-4px 0 30px;max-width:56ch}

/* actions */
.actions{display:flex;gap:12px;align-items:center;margin-top:10px}
.btn{border:0;border-radius:var(--r-btn);min-height:50px;padding:0 26px;font-size:17px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--navy);color:#fff}
.btn.p:hover{background:var(--navy-press)}
.btn.p:disabled{background:#C9CDE0;color:#fff;cursor:not-allowed}
.btn.t{background:transparent;color:var(--navy)}
.btn.t:hover{background:var(--sel)}
.btn svg{width:18px;height:18px}
[dir="rtl"] .flip{transform:scaleX(-1)}
.bottombar{display:none}
.status{font-size:16px;font-weight:600;margin-top:14px;min-height:1.5em}
.status.bad{color:var(--err)}

/* review */
.rv-sec{margin-bottom:28px}
.rv-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.rv-head h2{font-size:20px;margin:0}
.rv-head button{border:0;background:transparent;color:var(--navy);font-weight:700;font-size:16px;min-height:44px;padding:0 6px;cursor:pointer}
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 20px;padding:12px 18px;position:relative;font-size:16px}
.rv+.rv::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;height:1px;background:var(--sep)}
.rv .k{color:var(--ink2)}
.rv .v{font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.rv .v.none{color:var(--ink3);font-weight:400}
.missing{background:#FFF6E0;color:var(--gold-ink);border-radius:12px;padding:12px 16px;font-size:16px;margin-bottom:24px}

/* thanks */
.thanks{padding-top:30px}
.thanks img{height:72px;margin-bottom:20px}

.foot{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--ink3);font-size:14px}
#printView{display:none}

/* ---------- phone ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-block:18px 130px;padding-inline:16px}
  .journey{display:none}
  .jmini{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:15;background:var(--ground);padding:10px 16px 12px}
  .jmini .track{display:flex;align-items:center;gap:0}
  .jmini .st{width:12px;height:12px;border-radius:50%;background:var(--sep);flex:none}
  .jmini .st.done{background:var(--gold)}
  .jmini .st.cur{background:var(--navy);box-shadow:0 0 0 3px #C8CEEA}
  .jmini .ln{flex:1;height:3px;background:var(--sep)}
  .jmini .ln.done{background:var(--gold)}
  .jmini .lbl{font-size:14px;color:var(--ink2);margin-top:8px}
  .jmini .lbl b{color:var(--ink)}
  h1{font-size:30px}
  .lede{font-size:17.5px}
  .actions.inline{display:none}
  .bottombar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--group);gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 var(--sep)}
  .bottombar .btn.p{flex:1}
  .rv{grid-template-columns:1fr}
  .appbar-in{padding-inline:12px;gap:8px}
  .appbar img{height:30px}
  .menu{inset-inline:12px}
  .foot{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.screen.enter{animation:none}}

/* ---------- print: paper version of the whole questionnaire ---------- */
@page{size:A4;margin:14mm 13mm 16mm}
@media print{
  body{background:#fff;font-size:11pt;line-height:1.45;word-spacing:normal}
  .appbar,.layout,.jmini,.bottombar,.foot,.menu{display:none!important}
  #printView{display:block}
  .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold);padding-bottom:8px;margin-bottom:12px}
  .ph img{height:38px}.ph .t{font-weight:800;font-size:16pt;color:var(--navy)}
  .pmeta{display:grid;grid-template-columns:1fr 1fr 150px;gap:14px;margin-bottom:10px}
  .pline{border-bottom:1px solid #888;min-height:1.8em;padding:2px}
  .pl{font-size:9pt;color:#555}
  .psec{margin-top:12px}
  .psec h2{font-size:13pt;color:var(--navy);margin:0 0 6px;break-after:avoid}
  .pq{border:1px solid #C9CDDF;border-radius:6px;padding:7px 10px;margin-bottom:6px;break-inside:avoid}
  .pq .qt{font-weight:700;margin:0 0 2px;display:flex;gap:8px}
  .pq .qt i{font-style:normal;color:var(--gold-ink);min-width:2em}
  .pq .ph2{font-size:9pt;color:#666;margin:0 0 4px}
  .popts{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
  .popt{display:flex;gap:8px;align-items:flex-start}
  .pbox{width:12px;height:12px;border:1.5px solid #222;flex:none;margin-top:4px}
  .pbox.c{border-radius:50%}
  .pbox.on{background:#172A77;border-color:#172A77}
  .ptxt{min-height:1.7em;border-bottom:1px solid #999;white-space:pre-wrap;padding:2px}
  .ptxt.big{min-height:4.4em;border-bottom:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 1.45em,#bbb 1.45em,#bbb calc(1.45em + 1px))}
  .pfoot{text-align:center;font-size:9pt;color:#666;margin-top:10px}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <img src="assets/horiz.png" alt="المسار للتأمين">
    <div class="sp"></div>
    <div class="seg" role="group" aria-label="اللغة / Language">
      <button type="button" id="lang_ar" lang="ar">عربي</button>
      <button type="button" id="lang_en" lang="en">English</button>
    </div>
    <button class="iconbtn" type="button" id="printBtn" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7" rx="1"/></svg><span class="sr" id="printLbl"></span></button>
  </div>
  <div class="menu" id="menu" role="menu" hidden></div>
</header>
<div class="jmini" id="jmini" aria-hidden="true"></div>
<div class="layout">
  <nav class="journey" id="journey"></nav>
  <main class="screen" id="screen" tabindex="-1"></main>
</div>
<div class="bottombar" id="bottombar"></div>
<p class="foot" id="foot"></p>
<div id="printView"></div>

<script src="questions.js"></script>
<script src="config.js"></script>
<script>
(function(){
const SV=window.SURVEY,CFG=window.SURVEY_CONFIG||{};
const KEY="almasar-survey-draft-v2";
const T={
 title:["Management discovery","استبيان رؤية الإدارة"],
 lede:["Your answers help us prepare a marketing plan that fits Al-Masar's goals, budget and way of working. There are no right or wrong answers.","إجاباتكم تساعدنا على إعداد خطة تسويق تناسب أهداف المسار وميزانيتها وطريقة عملها. لا توجد إجابات صحيحة أو خاطئة."],
 facts:["<span><b>{n}</b> questions</span><span>About <b>10 minutes</b></span><span>Confidential, seen only by the consulting team</span>","<span><b>{n}</b> سؤالاً</span><span>حوالي <b>10 دقائق</b></span><span>سرية، لا يطّلع عليها إلا فريق الاستشارات</span>"],
 you:["About you","بياناتك"], name:["Name","الاسم"], role:["Role","المنصب"], roleph:["e.g. Chairman, General Manager","مثال: رئيس مجلس الإدارة، المدير العام"],
 nameReq:["Write your name to continue.","اكتب اسمك للمتابعة."],
 start:["Start","ابدأ"], next:["Continue","متابعة"], back:["Back","رجوع"], toReview:["Review answers","مراجعة الإجابات"],
 choose:["Choose one","اختر إجابة واحدة"], chooseMany:["Choose all that apply","اختر كل ما ينطبق"], upTo:["Choose up to {n}","اختر حتى {n}"],
 review:["Review and send","المراجعة والإرسال"], reviewLede:["Check your answers. You can edit any section before sending.","راجع إجاباتك، ويمكنك تعديل أي قسم قبل الإرسال."],
 edit:["Edit","تعديل"], noAns:["No answer","بلا إجابة"],
 missing:["{n} questions have no answer. You can send now or go back and complete them.","{n} سؤالاً بلا إجابة. يمكنك الإرسال الآن أو الرجوع لإكمالها."],
 send:["Send answers","إرسال الإجابات"], sending:["Sending…","جارٍ الإرسال…"],
 fail:["Your answers were not sent. Check the internet connection and try again; your answers are saved on this device.","لم تُرسل الإجابات. تأكد من اتصال الإنترنت وحاول مجدداً، فإجاباتك محفوظة على هذا الجهاز."],
 notConnected:["The survey is not connected yet. Contact the consulting team.","الاستبيان غير مفعّل بعد. تواصل مع فريق الاستشارات."],
 thanks:["Thank you, {name}","شكراً لكم، {name}"], thanksP:["Your answers reached the consulting team. We will use them to prepare a plan made for Al-Masar.","وصلت إجاباتكم إلى فريق الاستشارات، وسنعتمد عليها في إعداد خطة مصممة للمسار."],
 printMine:["Print or save as PDF","طباعة أو حفظ PDF"], printMineS:["With the answers filled in so far","مع الإجابات المعبأة حتى الآن"],
 printBlank:["Print a blank copy","طباعة نسخة فارغة"], printBlankS:["To fill in by hand","للتعبئة باليد"],
 printLbl:["Print","طباعة"],
 foot:["Prepared by the Smart Idea team for Al-Masar Insurance. Confidential.","إعداد فريق الفكرة الذكية لشركة المسار للتأمين. سرّي."],
 date:["Date","التاريخ"], pfoot:["Al-Masar Insurance. Confidential.","المسار للتأمين. سرّي."],
 of:["{a} of {b} answered","تمت الإجابة عن {a} من {b}"]
};
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){st={}}
const qp=new URLSearchParams(location.search);
if(qp.get("lang")==="en"||qp.get("lang")==="ar")st.lang=qp.get("lang");
if(st.lang!=="en"&&st.lang!=="ar")st.lang="ar";
if(qp.get("n")&&!st.name)st.name=qp.get("n");
st.a=st.a||{};if(typeof st.step!=="number")st.step=0;
let L=st.lang==="ar"?1:0,done=false,sending=false,lastSent=null;
const SECS=SV.sections, LAST=SECS.length+1; // 0 intro, 1..n sections, n+1 review
const ALLQ=[];SECS.forEach(s=>s.q.forEach(q=>ALLQ.push(q)));
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tr=(k,v)=>{let s=T[k][L];if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s};
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function answered(q,a){a=a||st.a;const v=a[q.id];if(q.type==="single")return v!=null;if(q.type==="multi")return Array.isArray(v)&&v.length>0;return !!(v&&String(v).trim())}
const secDone=i=>{const s=SECS[i-1];return s.q.filter(q=>answered(q)).length};
const stepName=i=>i===0?tr("you"):i===LAST?tr("review"):SECS[i-1].t[L];
const ICON={check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 next:'<svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
 prev:'<svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>'};

function journey(){
  const items=[];for(let i=0;i<=LAST;i++){
    const cls=i<st.step?"done":i===st.step?"cur":"";
    const cnt=i>=1&&i<=SECS.length?`<span class="cnt">${tr("of",{a:secDone(i),b:SECS[i-1].q.length})}</span>`:"";
    const can=!done&&(i<=st.step||(st.name&&st.name.trim()));
    items.push(`<li class="${cls}"><span class="dot" aria-hidden="true"></span><button type="button" data-go="${i}" ${can?"":"disabled"} ${i===st.step?'aria-current="step"':""}>${esc(stepName(i))}${cnt}</button></li>`)}
  $("#journey").innerHTML=done?"":`<ol>${items.join("")}</ol>`;
  $("#journey").setAttribute("aria-label",L?"مراحل الاستبيان":"Survey steps");
  let m='<div class="track">';for(let i=0;i<=LAST;i++){if(i)m+=`<span class="ln ${i<=st.step?"done":""}"></span>`;m+=`<span class="st ${i<st.step?"done":i===st.step?"cur":""}"></span>`}
  m+=`</div><div class="lbl"><b>${esc(stepName(st.step))}</b></div>`;
  $("#jmini").innerHTML=done?"":m;$("#jmini").hidden=done;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
}
function rowsFor(q){const v=st.a[q.id];
  return q.o.map((o,i)=>{const on=q.type==="single"?v===i:(Array.isArray(v)&&v.includes(i));
    return `<label class="row ${q.type}"><input type="${q.type==="single"?"radio":"checkbox"}" name="f_${q.id}" value="${i}" ${on?"checked":""}><span class="txt">${esc(o[L])}</span><span class="mk">${ICON.check}</span></label>`}).join("")}
function qBlock(q){
  if(q.o){const hint=q.type==="single"?tr("choose"):(q.max?tr("upTo",{n:q.max}):tr("chooseMany"));
    return `<fieldset class="q" data-q="${q.id}"><legend>${esc(q.t[L])}</legend><p class="hint">${hint}</p><div class="group" role="${q.type==="single"?"radiogroup":"group"}">${rowsFor(q)}${q.comment?`<div class="sub"><label class="sr" for="f_${q.id}_c">${esc(q.c[L])}</label><input type="text" id="f_${q.id}_c" placeholder="${esc(q.c[L])}" value="${esc(st.a[q.id+"_c"]||"")}"></div>`:""}</div></fieldset>`}
  const f=q.type==="text"?`<textarea id="f_${q.id}">${esc(st.a[q.id]||"")}</textarea>`:`<input type="text" id="f_${q.id}" value="${esc(st.a[q.id]||"")}">`;
  return `<div class="q" data-q="${q.id}"><label class="qt" for="f_${q.id}" style="display:block">${esc(q.t[L])}</label><div class="group" style="margin-top:10px">${f}</div></div>`;
}
function nav(primaryLbl,primaryId,disabled){
  const back=st.step>0?`<button class="btn t" type="button" data-nav="back">${ICON.prev}${tr("back")}</button>`:"";
  const prim=`<button class="btn p" type="button" id="${primaryId}" ${disabled?"disabled":""}>${primaryLbl}${primaryId==="send"?"":ICON.next}</button>`;
  return {inline:`<div class="actions inline">${prim}${back}</div>`,bar:back+prim.replace(`id="${primaryId}"`,`id="${primaryId}2"`)};
}
function render(focus){
  const root=document.documentElement;root.lang=L?"ar":"en";root.dir=L?"rtl":"ltr";
  document.title=L?"استبيان رؤية الإدارة | المسار للتأمين":"Management discovery | Al-Masar Insurance";
  $("#lang_ar").setAttribute("aria-pressed",L?"true":"false");$("#lang_en").setAttribute("aria-pressed",L?"false":"true");
  $("#printLbl").textContent=tr("printLbl");$("#printBtn").title=tr("printLbl");
  $("#foot").textContent=tr("foot");
  journey();
  const sc=$("#screen");let h="",n=null;
  if(done){
    h=`<div class="thanks"><img src="assets/symbol.png" alt=""><h1>${esc(tr("thanks",{name:lastSent?lastSent.name:""}))}</h1><p class="lede">${tr("thanksP")}</p><button class="btn t" type="button" id="prDone">${tr("printMine")}</button></div>`;
    sc.innerHTML=h;$("#bottombar").innerHTML="";$("#bottombar").hidden=true;$("#prDone").onclick=()=>doPrint(false);
  }else if(st.step===0){
    const ok=!!(st.name&&st.name.trim());n=nav(tr("start"),"next",!ok);
    h=`<h1>${tr("title")}</h1><p class="lede">${tr("lede")}</p><div class="facts">${tr("facts",{n:ALLQ.length})}</div>
     <div class="q"><div class="qt">${tr("you")}</div><div class="group" style="margin-top:10px">
      <label class="fieldlbl" for="r_name">${tr("name")} <span class="req" aria-hidden="true">*</span></label><input type="text" id="r_name" autocomplete="name" required aria-describedby="nameHint" value="${esc(st.name||"")}">
      <div class="sub"><label class="fieldlbl" for="r_role">${tr("role")}</label><input type="text" id="r_role" placeholder="${esc(tr("roleph"))}" value="${esc(st.role||"")}"></div></div>
      <p class="hint" style="margin-top:8px" id="nameHint" ${ok?"hidden":""}>${tr("nameReq")}</p></div>`+n.inline;
  }else if(st.step===LAST){
    const miss=ALLQ.filter(q=>!answered(q)).length;n=nav(tr("send"),"send",false);
    h=`<h1>${tr("review")}</h1><p class="lede">${tr("reviewLede")}</p>${miss?`<div class="missing">${tr("missing",{n:miss})}</div>`:""}`;
    h+=`<div class="rv-sec"><div class="rv-head"><h2>${tr("you")}</h2><button type="button" data-go="0">${tr("edit")}</button></div><div class="group"><div class="rv"><div class="k">${tr("name")}</div><div class="v">${esc(st.name||"")}</div></div><div class="rv"><div class="k">${tr("role")}</div><div class="v ${st.role?"":"none"}">${esc(st.role||tr("noAns"))}</div></div></div></div>`;
    SECS.forEach((s,i)=>{h+=`<div class="rv-sec"><div class="rv-head"><h2>${esc(s.t[L])}</h2><button type="button" data-go="${i+1}">${tr("edit")}</button></div><div class="group">`+s.q.map(q=>{const a=ansText(q,st.a);return `<div class="rv"><div class="k">${esc(q.t[L])}</div><div class="v ${a?"":"none"}">${esc(a||tr("noAns"))}</div></div>`}).join("")+`</div></div>`});
    h+=n.inline+`<p class="status" id="status" role="status" aria-live="polite"></p>`;
  }else{
    const s=SECS[st.step-1];n=nav(st.step===SECS.length?tr("toReview"):tr("next"),"next",false);
    h=`<h1>${esc(s.t[L])}</h1><p class="why">${esc(s.w[L])}</p>`+s.q.map(qBlock).join("")+n.inline;
  }
  if(!done){sc.innerHTML=h;$("#bottombar").hidden=false;$("#bottombar").innerHTML=n.bar;wire()}
  sc.classList.remove("enter");void sc.offsetWidth;sc.classList.add("enter");
  if(focus){sc.focus({preventScroll:true});window.scrollTo(0,0)}
}
function ansText(q,a){const v=a[q.id];let s="";
  if(q.type==="single")s=v!=null&&q.o[v]?q.o[v][L]:"";
  else if(q.type==="multi")s=Array.isArray(v)?v.map(i=>q.o[i]&&q.o[i][L]).filter(Boolean).join("، "):"";
  else s=v||"";
  if(q.comment&&a[q.id+"_c"])s+=(s?" — ":"")+a[q.id+"_c"];return s}
function wire(){
  document.querySelectorAll("[data-nav=back]").forEach(b=>b.onclick=()=>go(st.step-1));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  ["next","next2"].forEach(id=>{const b=$("#"+id);if(b)b.onclick=()=>go(st.step+1)});
  ["send","send2"].forEach(id=>{const b=$("#"+id);if(b)b.onclick=submit});
  const nm=$("#r_name");if(nm){nm.addEventListener("input",()=>{st.name=nm.value;save();const ok=!!nm.value.trim();["next","next2"].forEach(id=>{const b=$("#"+id);if(b)b.disabled=!ok});$("#nameHint").hidden=ok;journey()});
    $("#r_role").addEventListener("input",e=>{st.role=e.target.value;save()});}
  if(st.step>=1&&st.step<=SECS.length)SECS[st.step-1].q.forEach(q=>{
    if(q.type==="single")document.querySelectorAll(`input[name="f_${q.id}"]`).forEach(r=>r.addEventListener("change",()=>{st.a[q.id]=+r.value;save();journey()}));
    else if(q.type==="multi"){const bx=[...document.querySelectorAll(`input[name="f_${q.id}"]`)];
      const sync=()=>{if(!q.max)return;const c=bx.filter(b=>b.checked).length;bx.forEach(b=>{const lim=!b.checked&&c>=q.max;b.disabled=lim;b.closest(".row").classList.toggle("off",lim)})};
      bx.forEach(b=>b.addEventListener("change",()=>{st.a[q.id]=bx.filter(x=>x.checked).map(x=>+x.value);sync();save();journey()}));sync();
      if(q.comment)$(`#f_${q.id}_c`).addEventListener("input",e=>{st.a[q.id+"_c"]=e.target.value;save()});}
    else $(`#f_${q.id}`).addEventListener("input",e=>{st.a[q.id]=e.target.value;save();journey()});
  });
}
function go(i){if(i<0||i>LAST)return;if(i>0&&!(st.name&&st.name.trim()))return;st.step=i;save();render(true)}

/* print */
function buildPrint(blank,a,meta){
  const d=blank?"":new Date().toISOString().slice(0,10);
  let h=`<div class="ph"><img src="assets/horiz.png" alt=""><div class="t">${tr("title")}</div></div>
   <div class="pmeta"><div><div class="pl">${tr("name")}</div><div class="pline">${blank?"":esc(meta.name)}</div></div><div><div class="pl">${tr("role")}</div><div class="pline">${blank?"":esc(meta.role)}</div></div><div><div class="pl">${tr("date")}</div><div class="pline">${d}</div></div></div>`;
  SECS.forEach(s=>{h+=`<div class="psec"><h2>${esc(s.t[L])}</h2>`;s.q.forEach(q=>{const v=a[q.id];let b="";
    if(q.o){const hint=q.type==="single"?tr("choose"):(q.max?tr("upTo",{n:q.max}):tr("chooseMany"));
      b=`<p class="ph2">${hint}</p><div class="popts">`+q.o.map((o,i)=>{const on=!blank&&(q.type==="single"?v===i:(Array.isArray(v)&&v.includes(i)));return `<div class="popt"><span class="pbox ${q.type==="single"?"c":""} ${on?"on":""}"></span><span>${esc(o[L])}</span></div>`}).join("")+`</div>`;
      if(q.comment)b+=`<div class="ptxt" style="margin-top:4px">${blank?"":esc(a[q.id+"_c"]||"")}</div>`}
    else b=`<div class="ptxt ${q.type==="text"?"big":""}">${blank?"":esc(v||"")}</div>`;
    h+=`<div class="pq"><p class="qt"><i>${q.id}</i><span>${esc(q.t[L])}</span></p>${b}</div>`});h+=`</div>`});
  return h+`<div class="pfoot">${tr("pfoot")}</div>`;
}
function doPrint(blank){closeMenu();
  const src=done&&lastSent?lastSent:{name:st.name,role:st.role,answers:st.a};
  $("#printView").innerHTML=buildPrint(blank,src.answers,src);setTimeout(()=>window.print(),80)}
window.addEventListener("beforeprint",()=>{if(!$("#printView").innerHTML){const src=done&&lastSent?lastSent:{name:st.name,role:st.role,answers:st.a};$("#printView").innerHTML=buildPrint(false,src.answers,src)}});
window.addEventListener("afterprint",()=>{$("#printView").innerHTML=""});
function openMenu(){const m=$("#menu");m.innerHTML=`<button type="button" role="menuitem" id="pm1"><span>${tr("printMine")}<small>${tr("printMineS")}</small></span></button><button type="button" role="menuitem" id="pm2"><span>${tr("printBlank")}<small>${tr("printBlankS")}</small></span></button>`;
  m.hidden=false;$("#printBtn").setAttribute("aria-expanded","true");$("#pm1").onclick=()=>doPrint(false);$("#pm2").onclick=()=>doPrint(true);$("#pm1").focus()}
function closeMenu(){$("#menu").hidden=true;$("#printBtn").setAttribute("aria-expanded","false")}
$("#printBtn").onclick=e=>{e.stopPropagation();$("#menu").hidden?openMenu():closeMenu()};
document.addEventListener("click",e=>{if(!$("#menu").hidden&&!$("#menu").contains(e.target))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#menu").hidden){closeMenu();$("#printBtn").focus()}});

/* send */
function readable(){const o={};ALLQ.forEach(q=>{const v=st.a[q.id];let s="";
  if(q.type==="single")s=v!=null&&q.o[v]?q.o[v][0]:"";else if(q.type==="multi")s=Array.isArray(v)?v.map(i=>q.o[i]&&q.o[i][0]).filter(Boolean).join("; "):"";else s=v||"";
  if(q.comment&&st.a[q.id+"_c"])s+=(s?" | ":"")+"Details: "+st.a[q.id+"_c"];o[q.id]=s});return o}
async function post(ep,body){
  try{const r=await fetch(ep,{method:"POST",body,headers:{"Content-Type":"text/plain;charset=utf-8"}});let j=null;try{j=await r.json()}catch(e){}
    if(j&&j.ok===false)return false;return r.ok||!!(j&&j.ok)}
  catch(e){try{await fetch(ep,{method:"POST",mode:"no-cors",body,headers:{"Content-Type":"text/plain;charset=utf-8"}});return true}catch(e2){return false}}}
async function submit(){
  if(sending)return;const s=$("#status");s.className="status";
  if(!CFG.endpoint){s.className="status bad";s.textContent=tr("notConnected");return}
  st.sid=st.sid||((crypto.randomUUID&&crypto.randomUUID())||(Date.now().toString(36)+Math.random().toString(36).slice(2)));save();
  const p={id:st.sid,version:SV.version,submittedAt:new Date().toISOString(),name:(st.name||"").trim(),role:(st.role||"").trim(),lang:L?"ar":"en",answers:st.a,readable:readable(),cols:ALLQ.map(q=>[q.id,q.id+" · "+q.label])};
  sending=true;["send","send2"].forEach(id=>{const b=$("#"+id);if(b){b.disabled=true;b.textContent=tr("sending")}});
  const ok=await post(CFG.endpoint,JSON.stringify(p));sending=false;
  if(ok){lastSent=p;done=true;try{localStorage.removeItem(KEY)}catch(e){};st={lang:st.lang,a:{},step:0};render(true)}
  else{["send","send2"].forEach(id=>{const b=$("#"+id);if(b){b.disabled=false;b.textContent=tr("send")}});s.className="status bad";s.textContent=tr("fail")}
}
function setLang(l){if(st.lang===l)return;st.lang=l;L=l==="ar"?1:0;save();render(false)}
$("#lang_ar").onclick=()=>setLang("ar");$("#lang_en").onclick=()=>setLang("en");
if(st.step>0&&!(st.name&&st.name.trim()))st.step=0;
render(false);
})();
</script>
</body>
