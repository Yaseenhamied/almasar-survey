<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>استبيان رؤية الإدارة | المسار للتأمين</title>
<meta property="og:title" content="استبيان رؤية الإدارة | المسار للتأمين">
<meta property="og:description" content="23 سؤالاً · حوالي 10 دقائق">
<meta property="og:image" content="https://yaseenhamied.github.io/almasar-survey/assets/og.png">
<meta property="og:type" content="website">
<link rel="icon" href="assets/symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Beiruti:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Al-Masar brand: navy + gold on white, gold path line in the masthead. Single light look (also the print look). */
:root{
  --navy:#172A77;--navy2:#0F1D57;--gold:#EAA918;--gold-soft:#FBF1D9;
  --bg:#F4F6FB;--surface:#FFFFFF;--ink:#141B3D;--muted:#5A628A;--line:#DCE0EE;--chip:#EEF1F9;--ok:#1F7A4D;--err:#B42318;
  --font:"Beiruti","Nunito",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
:root[lang="en"]{--font:"Nunito","Beiruti",system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.65;word-spacing:.12em}
:root[lang="en"] body{font-size:17px;word-spacing:normal}
.mast{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.mast-in{max-width:980px;margin:0 auto;padding:22px 16px 86px;position:relative;z-index:1}
.mast svg.wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:80px;z-index:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top img{height:54px;width:auto}
.langsw{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:3px;gap:2px}
.langsw button{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:99px;padding:5px 14px;cursor:pointer;background:transparent;color:#fff;word-spacing:normal}
.langsw button[aria-pressed="true"]{background:var(--gold);color:var(--navy)}
#lang_ar{font-family:"Beiruti",sans-serif;font-size:17px}#lang_en{font-family:"Nunito",sans-serif}
h1{font-size:clamp(28px,5vw,42px);font-weight:800;line-height:1.25;margin:26px 0 10px;text-wrap:balance}
.lead{margin:0;color:#D8DDF3;max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:.88em;color:#C9CFEA}
.meta b{color:#fff}
.toolbar{max-width:980px;margin:-34px auto 0;padding-inline:16px;position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-start}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid var(--navy);display:inline-flex;align-items:center;gap:8px;word-spacing:normal}
.btn.p{background:var(--navy);color:#fff}
.btn.g{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.s{background:#fff;color:var(--navy);border-color:var(--line)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,textarea:focus,input:focus{outline:3px solid var(--gold);outline-offset:2px}
.btn svg{width:18px;height:18px}
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:5px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.about h2{margin:0 0 12px;font-size:1.15em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
label.fl{display:block;font-weight:700;margin-bottom:6px}
label.fl .req{color:var(--err)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;word-spacing:inherit}
textarea{min-height:92px;resize:vertical}
.err-msg{color:var(--err);font-size:.85em;margin-top:6px}
.sec-h{display:flex;align-items:center;gap:12px}
.sec-h .l{font-family:"Nunito",sans-serif;font-weight:800;color:var(--navy);background:var(--gold);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.sec-h h2{margin:0;font-size:1.4em;line-height:1.3;color:var(--navy)}
.why{color:var(--muted);margin:6px 0 14px}
.qs{display:flex;flex-direction:column;gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.q .qt{font-weight:700;display:flex;gap:10px;margin:0}
.q .qt .id{color:var(--navy);font-family:"Nunito",sans-serif;font-weight:800;font-size:.85em;min-width:2.1em;flex:none;padding-top:.2em}
.q .body{margin-inline-start:calc(2.1em + 10px);display:grid;gap:10px;min-width:0}
.hint{font-size:.85em;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;background:#fff;font-size:.95em;line-height:1.4}
.opt input{position:absolute;opacity:0;pointer-events:none}
.box{width:18px;height:18px;border:2px solid #9AA3C7;flex:none;position:relative;background:#fff}
.opt.single .box{border-radius:50%}.opt.multi .box{border-radius:4px}
.opt:has(input:checked){border-color:var(--navy);background:var(--chip);font-weight:700}
.opt input:checked~.box{border-color:var(--navy);background:var(--navy)}
.opt.single input:checked~.box::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff}
.opt.multi input:checked~.box::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.opt.dis{opacity:.45;cursor:not-allowed}
.pv,.print-only{display:none}
.send{display:grid;gap:14px}
.send h2{margin:0;color:var(--navy)}
.status{min-height:1.4em;font-weight:700}
.status.ok{color:var(--ok)}.status.bad{color:var(--err)}
.thanks{text-align:center;padding:48px 22px}
.thanks h2{font-size:1.8em;color:var(--navy);margin:14px 0 6px}
.thanks img{height:90px}
footer{max-width:980px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.8em;text-align:center}
@media (max-width:640px){.q .body{margin-inline-start:0}.opts{flex-direction:column}.opt{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- PRINT ---------- */
@page{size:A4;margin:14mm 13mm 16mm}
@media print{
  body{background:#fff;font-size:11.5pt;line-height:1.5}
  .mast,.toolbar,.progress,.send,.no-print,footer,.thanks{display:none!important}
  .print-only{display:block}
  .ph{display:flex!important;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold);padding-bottom:8px;margin-bottom:10px}
  .ph img{height:40px}.ph .t{font-weight:800;font-size:15pt;color:var(--navy)}
  main{padding:0;gap:10px;max-width:none}
  .card,.q{border:1px solid #C9CFE3;border-radius:8px;padding:8px 12px;break-inside:avoid}
  section.sec{break-inside:auto}
  .sec-h{break-after:avoid}.sec-h .l{width:26px;height:26px;border-radius:6px}
  .sec-h h2{font-size:14pt}.why{margin:2px 0 6px;font-size:10pt}
  .qs{gap:6px}
  .q .body{margin-inline-start:0}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px}
  .opt.dis{opacity:1}
  .opt{border:0;padding:1px 0;background:none!important;font-weight:400!important}
  .box{width:13px;height:13px;border:1.5px solid #333}
  .opt input:checked~.box{background:#172A77}
  body.blank .opt input:checked~.box{background:#fff;border-color:#333}
  body.blank .opt input:checked~.box::after{display:none}
  body.blank .opt:has(input:checked){font-weight:400}
  textarea,input[type=text]{display:none!important}
  .pv{display:block;border-bottom:1px solid #999;min-height:1.9em;white-space:pre-wrap;padding:2px 2px}
  .pv.big{min-height:4.6em;background:repeating-linear-gradient(to bottom,transparent 0,transparent 1.5em,#bbb 1.5em,#bbb calc(1.5em + 1px));border-bottom:0}
  .about h2{font-size:12pt;margin:0 0 4px}
  .hint{font-size:9pt}
  .pfoot{display:block;text-align:center;font-size:9pt;color:#666;margin-top:10px}
}
</style>
</head>
<body>
<div class="progress no-print" aria-hidden="true"><i id="bar"></i></div>
<header class="mast">
  <div class="mast-in">
    <div class="top">
      <img src="assets/horiz_white.png" alt="المسار للتأمين">
      <div class="langsw" role="group" aria-label="اللغة / Language">
        <button type="button" id="lang_ar" lang="ar">العربية</button>
        <button type="button" id="lang_en" lang="en">English</button>
      </div>
    </div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <div class="meta" id="meta"></div>
  </div>
  <svg class="wave" viewBox="0 0 1200 80" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 62 C 250 8, 450 86, 700 40 S 1050 4, 1200 36" fill="none" stroke="#EAA918" stroke-width="3"/>
    <path d="M0 74 C 260 26, 470 96, 720 54 S 1060 18, 1200 50" fill="none" stroke="#EAA918" stroke-width="1.4" opacity=".45"/>
  </svg>
</header>
<div class="toolbar" id="toolbar"></div>
<main id="main"></main>
<footer id="foot"></footer>

<script src="questions.js"></script>
<script src="config.js"></script>
<script>
(function(){
const SV=window.SURVEY, CFG=window.SURVEY_CONFIG||{};
const KEY="almasar-survey-draft-v1";
const T={
 h1:["Management discovery questionnaire","استبيان رؤية الإدارة"],
 lead:["Your answers help us prepare a marketing plan that fits Al-Masar's goals, budget and way of working. There are no right or wrong answers.","إجاباتكم تساعدنا على إعداد خطة تسويق تناسب أهداف المسار وميزانيتها وطريقة عملها. لا توجد إجابات صحيحة أو خاطئة."],
 meta:["<span><b>{n}</b> questions</span><span>About <b>10 minutes</b></span><span>Your answers are confidential</span>","<span><b>{n}</b> سؤالاً</span><span>حوالي <b>10 دقائق</b></span><span>إجاباتكم سرية</span>"],
 printMine:["Print / Save as PDF","طباعة / حفظ PDF"], printBlank:["Print a blank copy","طباعة نسخة فارغة"],
 about:["About you","بياناتك"], name:["Your name","الاسم"], role:["Your role","المنصب"], roleph:["e.g. Chairman, General Manager","مثال: رئيس مجلس الإدارة، المدير العام"],
 nameReq:["Please write your name so we know who answered.","يرجى كتابة الاسم حتى نعرف صاحب الإجابات."],
 choose:["Choose one","اختر إجابة واحدة"], chooseMany:["Choose all that apply","اختر كل ما ينطبق"], upTo:["Choose up to {n}","اختر حتى {n}"],
 send:["Send your answers","إرسال الإجابات"], sendBtn:["Send answers","إرسال الإجابات"],
 sendTxt:["Check your answers, then press Send. Only the consulting team will see them.","راجع إجاباتك ثم اضغط إرسال. لن يطّلع عليها إلا فريق الاستشارات."],
 left:["{n} questions are still unanswered. Press Send again to send anyway, or complete them first.","ما زال {n} سؤالاً بلا إجابة. اضغط إرسال مرة أخرى للإرسال كما هي، أو أكملها أولاً."],
 sending:["Sending…","جارٍ الإرسال…"],
 fail:["Your answers could not be sent. Check your internet connection and try again. Your answers are saved on this device.","تعذّر إرسال الإجابات. تأكد من اتصال الإنترنت وحاول مجدداً. إجاباتك محفوظة على هذا الجهاز."],
 notConnected:["The survey is not connected yet. Please contact the consulting team.","الاستبيان غير مفعّل بعد. يرجى التواصل مع فريق الاستشارات."],
 thanksH:["Thank you, {name}","شكراً لكم، {name}"], thanksP:["Your answers reached the consulting team. We will use them to prepare a plan tailored to Al-Masar.","وصلت إجاباتكم إلى فريق الاستشارات، وسنعتمد عليها في إعداد خطة مصممة للمسار."],
 printCopy:["Print a copy of my answers","طباعة نسخة من إجاباتي"],
 footer:["Prepared by the Smart Idea team for Al-Masar Insurance · Confidential","إعداد فريق الفكرة الذكية لشركة المسار للتأمين · سرّي"],
 printTitle:["Management discovery questionnaire","استبيان رؤية الإدارة"], date:["Date","التاريخ"], pfoot:["Al-Masar Insurance · Confidential","المسار للتأمين · سرّي"],
 saved:["Saved on this device","محفوظ على هذا الجهاز"]
};
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){st={}}
const qp=new URLSearchParams(location.search);
if(qp.get("lang")==="en"||qp.get("lang")==="ar")st.lang=qp.get("lang");
if(st.lang!=="en"&&st.lang!=="ar")st.lang="ar";
if(qp.get("n")&&!st.name)st.name=qp.get("n");
let L=st.lang==="ar"?1:0, done=false, armed=false, sending=false, lastSent=null;
const tr=(k,v)=>{let s=T[k][L];if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=(s,r=document)=>r.querySelector(s);
const ALLQ=[];SV.sections.forEach(s=>s.q.forEach(q=>ALLQ.push(q)));
const A=()=>{st.a=st.a||{};return st.a};
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){};progress()}
function answered(q){const v=A()[q.id];if(q.type==="single")return v!=null;if(q.type==="multi")return Array.isArray(v)&&v.length>0;return !!(v&&String(v).trim())}
function progress(){const n=ALLQ.filter(answered).length;const b=$("#bar");if(b)b.style.width=(n/ALLQ.length*100)+"%"}
const printIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg>';

function render(){
  const root=document.documentElement;root.lang=L?"ar":"en";root.dir=L?"rtl":"ltr";
  document.title=L?"استبيان رؤية الإدارة | المسار للتأمين":"Management discovery | Al-Masar Insurance";
  $("#lang_ar").setAttribute("aria-pressed",L?"true":"false");$("#lang_en").setAttribute("aria-pressed",L?"false":"true");
  $("#h1").textContent=tr("h1");$("#lead").textContent=tr("lead");$("#meta").innerHTML=tr("meta",{n:ALLQ.length});
  $("#foot").textContent=tr("footer");
  $("#toolbar").innerHTML=done?"":`<button class="btn g" type="button" id="pr1">${printIcon}${tr("printMine")}</button><button class="btn s" type="button" id="pr2">${printIcon}${tr("printBlank")}</button>`;
  if(!done){$("#pr1").onclick=()=>doPrint(false);$("#pr2").onclick=()=>doPrint(true)}
  const m=$("#main");
  if(done){
    m.innerHTML=`<div class="card thanks"><img src="assets/symbol.png" alt=""><h2>${esc(tr("thanksH",{name:lastSent&&lastSent.name||""}))}</h2><p style="color:var(--muted);max-width:52ch;margin:0 auto 22px">${tr("thanksP")}</p><div class="btns"><button class="btn s" type="button" id="prDone">${printIcon}${tr("printCopy")}</button></div></div>`+printBlock();
    $("#prDone").onclick=()=>doPrint(false);return;
  }
  let h=printHead()+`<div class="card about"><h2>${tr("about")}</h2><div class="grid2">
    <div><label class="fl" for="r_name">${tr("name")} <span class="req">*</span></label><input type="text" id="r_name" autocomplete="name" value="${esc(st.name||"")}"><div class="pv" data-pv="name"></div><div class="err-msg no-print" id="nameErr" hidden>${tr("nameReq")}</div></div>
    <div><label class="fl" for="r_role">${tr("role")}</label><input type="text" id="r_role" placeholder="${esc(tr("roleph"))}" value="${esc(st.role||"")}"><div class="pv" data-pv="role"></div></div></div></div>`;
  SV.sections.forEach(s=>{
    h+=`<section class="sec" id="sec-${s.k}"><div class="sec-h"><span class="l">${s.k}</span><h2>${esc(s.t[L])}</h2></div><p class="why">${esc(s.w[L])}</p><div class="qs">`;
    s.q.forEach(q=>{
      const v=A()[q.id];let body="";
      if(q.type==="single"||q.type==="multi"){
        const hint=q.type==="single"?tr("choose"):(q.max?tr("upTo",{n:q.max}):tr("chooseMany"));
        body=`<div class="hint">${hint}</div><div class="opts" role="${q.type==="single"?"radiogroup":"group"}" aria-labelledby="t_${q.id}">`+q.o.map((o,i)=>{
          const on=q.type==="single"?v===i:(Array.isArray(v)&&v.includes(i));
          return `<label class="opt ${q.type}"><input type="${q.type==="single"?"radio":"checkbox"}" name="f_${q.id}" value="${i}" ${on?"checked":""}><span class="box" aria-hidden="true"></span><span>${esc(o[L])}</span></label>`}).join("")+`</div>`;
        if(q.comment)body+=`<input type="text" id="f_${q.id}_c" placeholder="${esc(q.c[L])}" value="${esc(A()[q.id+"_c"]||"")}" aria-label="${esc(q.c[L])}"><div class="pv" data-pv="${q.id}_c"></div>`;
      }else if(q.type==="text"){
        body=`<textarea id="f_${q.id}" aria-labelledby="t_${q.id}">${esc(v||"")}</textarea><div class="pv big" data-pv="${q.id}"></div>`;
      }else{
        body=`<input type="text" id="f_${q.id}" aria-labelledby="t_${q.id}" value="${esc(v||"")}"><div class="pv" data-pv="${q.id}"></div>`;
      }
      h+=`<div class="q" data-q="${q.id}"><p class="qt" id="t_${q.id}"><span class="id">${q.id}</span><span>${esc(q.t[L])}</span></p><div class="body">${body}</div></div>`;
    });
    h+=`</div></section>`;
  });
  h+=`<div class="card send no-print"><h2>${tr("send")}</h2><p style="margin:0;color:var(--muted)">${tr("sendTxt")}</p><div><button class="btn p" type="button" id="sendBtn">${tr("sendBtn")}</button></div><div class="status" id="status" role="status" aria-live="polite"></div></div>`;
  h+=`<div class="print-only pfoot">${tr("pfoot")}</div>`;
  m.innerHTML=h;wire();progress();
}
function printHead(){const d=new Date().toISOString().slice(0,10);return `<div class="print-only ph" style="display:none"><img src="assets/horiz.png" alt=""><div class="t">${tr("printTitle")}</div><div style="font-size:9pt;color:#555">${tr("date")}: <span class="pdate">${d}</span></div></div>`}
function printBlock(){ // printable copy of submitted answers after thank-you
  const a=lastSent?lastSent.answers:{};let h=`<div class="print-only">`+printHead().replace('style="display:none"','')+`<div class="card about"><b>${tr("name")}:</b> ${esc(lastSent&&lastSent.name)} &nbsp; <b>${tr("role")}:</b> ${esc(lastSent&&lastSent.role)}</div>`;
  SV.sections.forEach(s=>{h+=`<section class="sec"><div class="sec-h"><span class="l">${s.k}</span><h2>${esc(s.t[L])}</h2></div><div class="qs">`;
    s.q.forEach(q=>{const v=a[q.id];let body="";
      if(q.o){body=`<div class="opts">`+q.o.map((o,i)=>{const on=q.type==="single"?v===i:(Array.isArray(v)&&v.includes(i));return `<label class="opt ${q.type}"><input type="checkbox" disabled ${on?"checked":""}><span class="box"></span><span>${esc(o[L])}</span></label>`}).join("")+`</div>`;if(q.comment&&a[q.id+"_c"])body+=`<div class="pv" style="display:block">${esc(a[q.id+"_c"])}</div>`}
      else body=`<div class="pv${q.type==="text"?" big":""}" style="display:block">${esc(v||"")}</div>`;
      h+=`<div class="q"><p class="qt"><span class="id">${q.id}</span><span>${esc(q.t[L])}</span></p><div class="body">${body}</div></div>`});
    h+=`</div></section>`});
  return h+`<div class="pfoot">${tr("pfoot")}</div></div>`;
}
function wire(){
  $("#r_name").addEventListener("input",e=>{st.name=e.target.value;$("#nameErr").hidden=true;save()});
  $("#r_role").addEventListener("input",e=>{st.role=e.target.value;save()});
  ALLQ.forEach(q=>{
    if(q.type==="single"){document.querySelectorAll(`input[name="f_${q.id}"]`).forEach(r=>r.addEventListener("change",()=>{A()[q.id]=+r.value;save()}))}
    else if(q.type==="multi"){
      const boxes=[...document.querySelectorAll(`input[name="f_${q.id}"]`)];
      const sync=()=>{if(!q.max)return;const n=boxes.filter(b=>b.checked).length;boxes.forEach(b=>{const lim=!b.checked&&n>=q.max;b.disabled=lim;b.closest(".opt").classList.toggle("dis",lim)})};
      boxes.forEach(b=>b.addEventListener("change",()=>{A()[q.id]=boxes.filter(x=>x.checked).map(x=>+x.value);sync();save()}));sync();
      if(q.comment)$(`#f_${q.id}_c`).addEventListener("input",e=>{A()[q.id+"_c"]=e.target.value;save()});
    }else $(`#f_${q.id}`).addEventListener("input",e=>{A()[q.id]=e.target.value;save()});
  });
  $("#sendBtn").onclick=submit;
}
function fillPv(blank){
  document.querySelectorAll(".pv[data-pv]").forEach(el=>{const k=el.dataset.pv;let v="";
    if(!blank){if(k==="name")v=st.name;else if(k==="role")v=st.role;else v=A()[k]}
    el.textContent=v||""});
  document.querySelectorAll(".pdate").forEach(el=>el.textContent=blank?"":new Date().toISOString().slice(0,10));
}
function doPrint(blank){document.body.classList.toggle("blank",!!blank);fillPv(!!blank);setTimeout(()=>window.print(),60)}
window.addEventListener("beforeprint",()=>{if(!document.body.classList.contains("blank"))fillPv(false)});
window.addEventListener("afterprint",()=>{document.body.classList.remove("blank");fillPv(false)});

function readable(){const out={};const ans=A();
  ALLQ.forEach(q=>{const v=ans[q.id];let s="";
    if(q.type==="single")s=v!=null&&q.o[v]?q.o[v][0]:"";
    else if(q.type==="multi")s=Array.isArray(v)?v.map(i=>q.o[i]&&q.o[i][0]).filter(Boolean).join("; "):"";
    else s=v||"";
    if(q.comment&&ans[q.id+"_c"])s+=(s?" | ":"")+"Details: "+ans[q.id+"_c"];
    out[q.id]=s});
  return out}
async function post(ep,body){
  try{const r=await fetch(ep,{method:"POST",body,headers:{"Content-Type":"text/plain;charset=utf-8"}});
    let j=null;try{j=await r.json()}catch(e){}
    if(j&&j.ok===false)return {ok:false};return {ok:r.ok||!!(j&&j.ok)};}
  catch(e){ // CORS/network: retry without reading the response (server ignores duplicate ids)
    try{await fetch(ep,{method:"POST",mode:"no-cors",body,headers:{"Content-Type":"text/plain;charset=utf-8"}});return {ok:true}}catch(e2){return {ok:false}}}
}
async function submit(){
  if(sending)return;const s=$("#status");s.className="status";
  if(!st.name||!st.name.trim()){$("#nameErr").hidden=false;$("#r_name").focus();$("#r_name").scrollIntoView({block:"center"});return}
  const left=ALLQ.length-ALLQ.filter(answered).length;
  if(left>0&&!armed){armed=true;s.className="status bad";s.textContent=tr("left",{n:left});return}
  if(!CFG.endpoint){s.className="status bad";s.textContent=tr("notConnected");return}
  st.sid=st.sid||((crypto.randomUUID&&crypto.randomUUID())||(Date.now().toString(36)+Math.random().toString(36).slice(2)));save();
  const payload={id:st.sid,version:SV.version,submittedAt:new Date().toISOString(),name:st.name.trim(),role:(st.role||"").trim(),lang:L?"ar":"en",
    answers:A(),readable:readable(),cols:ALLQ.map(q=>[q.id,q.id+" · "+q.label])};
  sending=true;const b=$("#sendBtn");b.disabled=true;b.textContent=tr("sending");
  const r=await post(CFG.endpoint,JSON.stringify(payload));
  sending=false;
  if(r.ok){lastSent=payload;done=true;try{localStorage.removeItem(KEY)}catch(e){};const lang=st.lang;st={lang};render();window.scrollTo(0,0)}
  else{b.disabled=false;b.textContent=tr("sendBtn");s.className="status bad";s.textContent=tr("fail")}
}
function setLang(l){if(st.lang===l)return;st.lang=l;L=l==="ar"?1:0;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){};const y=scrollY;render();scrollTo(0,y)}
$("#lang_ar").onclick=()=>setLang("ar");$("#lang_en").onclick=()=>setLang("en");
render();
})();
</script>
</body>
