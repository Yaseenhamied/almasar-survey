<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#172A77">
<title>استبيان رؤية الإدارة | المسار للتأمين</title>
<meta property="og:title" content="استبيان رؤية الإدارة | المسار للتأمين">
<meta property="og:description" content="58 سؤالاً، معظمها بلمسة واحدة، حوالي 20 دقيقة، وإجاباتكم سرية">
<meta property="og:image" content="https://yaseenhamied.github.io/almasar-survey/assets/og.png">
<meta property="og:type" content="website">
<link rel="icon" href="assets/symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Beiruti:wght@400;500;600;700;800;900&display=swap">
<style>
/* Al-Masar survey — "the protected path".
   One face: Beiruti. Navy carries the brand stages and every action; gold is the path itself
   (progress line, the moving marker, the logo's draw). The brand link-pattern is the only texture.
   Signature moment: the logo draws itself along its infinity loop (welcome and finale).
   Phone: one section per screen, bottom action bar. Desktop: journey rail + 660px column. */
:root{
  --ground:#F1F2F7;--group:#FFFFFF;--ink:#121833;--ink2:#4C5374;--ink3:#7E84A3;--sep:#E3E5EE;
  --navy:#172A77;--navy-deep:#0F1D57;--navy-press:#0C1749;--sel:#EEF0F8;--gold:#EAA918;--gold-ink:#7A5400;--err:#B42318;
  --r-group:18px;--r-stage:28px;--r-btn:999px;
  --font:"Beiruti",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-expo:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.76,0,.24,1);--ease-exit:cubic-bezier(.55,.055,.675,.19);
  --t-press:140ms;--t-hover:180ms;--t-ui:260ms;--t-reveal:850ms;--t-open:1500ms;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.55;word-spacing:.1em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit;word-spacing:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 var(--sep)}
.appbar-in{max-width:1200px;margin:0 auto;height:64px;padding-inline:20px;display:flex;align-items:center;gap:14px}
.appbar img{height:34px;width:auto;display:block}
.appbar .sp{flex:1}
.pct{font-size:15px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.seg{display:inline-flex;background:var(--ground);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:38px;padding:0 14px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink2);transition:background var(--t-hover) ease,color var(--t-hover) ease}
.seg button[aria-pressed="true"]{background:var(--group);color:var(--navy);box-shadow:0 1px 2px rgba(18,24,51,.14)}
.iconbtn{border:0;background:transparent;min-width:44px;min-height:44px;border-radius:12px;display:inline-grid;place-items:center;color:var(--navy);cursor:pointer;transition:background var(--t-hover) ease}
.iconbtn:hover{background:var(--ground)}
.iconbtn svg{width:22px;height:22px}
.menu{position:absolute;inset-inline-end:16px;top:calc(env(safe-area-inset-top,0px) + 60px);background:var(--group);border-radius:16px;box-shadow:0 14px 36px rgba(18,24,51,.2);min-width:260px;padding:6px;z-index:40;animation:pop var(--t-ui) var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.menu button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:transparent;text-align:start;min-height:50px;padding:0 12px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.menu button:hover{background:var(--ground)}
.menu small{display:block;color:var(--ink3);font-size:13px;font-weight:400;line-height:1.3}

/* ---------- layout ---------- */
.layout{max-width:1200px;margin:0 auto;padding-inline:20px;display:grid;grid-template-columns:260px minmax(0,660px);gap:72px;justify-content:center;padding-block:36px 90px}
.layout.wide{grid-template-columns:minmax(0,1fr);max-width:1200px;padding-block:24px 70px}
.screen{min-width:0;outline:none}

/* journey rail with travelling marker */
.journey{position:sticky;top:104px;align-self:start}
.journey ol{list-style:none;margin:0;padding:0;position:relative}
.journey li{position:relative;padding-inline-start:44px;min-height:62px}
.journey li::before{content:"";position:absolute;inset-inline-start:14px;top:30px;bottom:-2px;width:3px;border-radius:2px;background:var(--sep)}
.journey li::after{content:"";position:absolute;inset-inline-start:14px;top:30px;width:3px;border-radius:2px;background:var(--gold);height:0;transition:height .7s var(--ease-io)}
.journey li.done::after{height:calc(100% - 28px)}
.journey li:last-of-type::before,.journey li:last-of-type::after{display:none}
.journey .dot{position:absolute;inset-inline-start:5px;top:6px;width:21px;height:21px;border-radius:50%;border:3px solid var(--sep);background:var(--ground);transition:border-color var(--t-ui) ease,background var(--t-ui) ease}
.journey li.done .dot{background:var(--gold);border-color:var(--gold)}
.journey li.cur .dot{border-color:var(--navy)}
.journey button{border:0;background:transparent;padding:4px 0;text-align:start;cursor:pointer;font-size:17px;line-height:1.35;color:var(--ink2);transition:color var(--t-hover) ease}
.journey button:hover:not(:disabled){color:var(--navy)}
.journey li.cur button{color:var(--ink);font-weight:800}
.journey button:disabled{cursor:default;color:var(--ink3)}
.journey .cnt{display:block;font-size:13px;color:var(--ink3);font-weight:500}
.marker{position:absolute;inset-inline-start:-4px;top:0;width:39px;height:39px;border-radius:50%;background:var(--navy);display:grid;place-items:center;box-shadow:0 6px 16px rgba(23,42,119,.35);transition:transform .7s var(--ease-expo);z-index:2;pointer-events:none}
.marker img{width:27px;height:auto}
.jmini{display:none}

/* ---------- welcome stage ---------- */
.stage{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:var(--r-stage);isolation:isolate}
.stage .pat{position:absolute;inset:0;background:url(assets/pattern_navy.png) center/cover no-repeat;z-index:-1;transform:scale(1.06);animation:breathe 26s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1.06) translate3d(-1.2%,-1%,0)}to{transform:scale(1.12) translate3d(1.2%,1%,0)}}
.stage .pathline{position:absolute;inset-inline:0;bottom:0;width:100%;height:130px;z-index:-1}
.stage .pathline path{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 2.2s var(--ease-io) .2s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.welcome{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding:56px 56px 120px}
.welcome h1{font-size:clamp(40px,4.6vw,64px);line-height:1.08;font-weight:900;margin:0 0 18px;letter-spacing:-.01em}
.line{display:block;overflow:hidden;padding-bottom:.08em}
.line>span{display:block;transform:translateY(105%);animation:rise var(--t-reveal) var(--ease-expo) forwards}
.line:nth-child(2)>span{animation-delay:90ms}
@keyframes rise{to{transform:none}}
.welcome .lede{font-size:20px;color:#D7DCF2;max-width:46ch;margin:0 0 26px;opacity:0;animation:fadeup .7s var(--ease-out) .35s forwards}
.welcome .tag{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-weight:800;font-size:20px;margin-bottom:20px;opacity:0;animation:fadeup .7s var(--ease-out) .1s forwards}
.welcome .tag::before{content:"";width:34px;height:3px;background:var(--gold);border-radius:2px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;opacity:0;animation:fadeup .7s var(--ease-out) .5s forwards}
.fact{background:rgba(255,255,255,.1);border-radius:999px;padding:7px 16px;font-size:15px;color:#E9ECF8}
.fact b{color:#fff}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo-stage{display:grid;place-items:center}
.logo-draw{position:relative;width:min(100%,460px);aspect-ratio:1400/732;opacity:0;transform:scale(.92);animation:logoIn 1.1s var(--ease-expo) .3s forwards;
  -webkit-mask:url(assets/symbol_2tone.png) center/contain no-repeat;mask:url(assets/symbol_2tone.png) center/contain no-repeat}
.logo-draw img{display:block;width:100%;height:100%;object-fit:contain}
/* glare: a soft light band sweeps across the logo only (clipped by the logo mask) */
.logo-draw::after{content:"";position:absolute;inset:-10% -40%;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.08) 44%,rgba(255,255,255,.85) 50%,rgba(255,255,255,.08) 56%,transparent 62%);transform:translateX(-60%);animation:glare 4.8s var(--ease-io) 1.4s infinite}
@keyframes logoIn{to{opacity:1;transform:none}}
@keyframes glare{0%{transform:translateX(-60%)}50%,100%{transform:translateX(60%)}}
.logo-cap{margin-top:18px;text-align:center;font-weight:800;font-size:22px;color:#fff;opacity:0;animation:fadeup .7s var(--ease-out) 1.7s forwards}
.logo-cap span{color:var(--gold)}
.start-card{margin-top:-80px;position:relative;z-index:2;max-width:620px;margin-inline:auto;background:var(--group);border-radius:var(--r-group);padding:22px 22px 18px;box-shadow:0 18px 50px rgba(18,24,51,.14);opacity:0;animation:fadeup .8s var(--ease-out) .65s forwards}
.start-card h2{margin:0 0 4px;font-size:22px}
.start-card .hint{margin:0 0 14px}

/* ---------- chapter header ---------- */
.chapter{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:var(--r-stage);padding:30px 30px 28px;margin-bottom:30px;isolation:isolate}
.chapter .pat{position:absolute;inset:0;background:url(assets/pattern_navy.png) center/cover no-repeat;z-index:-1}
.chapter .k{font-size:15px;font-weight:700;color:var(--gold);margin-bottom:6px}
.chapter h1{font-size:clamp(30px,3.2vw,40px);line-height:1.15;font-weight:900;margin:0 0 8px}
.chapter p{margin:0;color:#D7DCF2;font-size:17.5px;max-width:52ch}
.chapter .bar{margin-top:20px;height:6px;background:rgba(255,255,255,.16);border-radius:6px;overflow:hidden}
.chapter .bar i{display:block;height:100%;background:var(--gold);border-radius:6px;width:0;transition:width .6s var(--ease-out)}

/* ---------- questions ---------- */
h1.plain{font-size:40px;line-height:1.15;font-weight:900;margin:0 0 10px}
.lede2{font-size:19px;color:var(--ink2);margin:0 0 26px;max-width:56ch}
.q{border:0;padding:0;margin:0 0 34px;min-width:0}
.q legend,.q .qt{padding:0;font-size:20px;font-weight:800;line-height:1.45;margin-bottom:4px;float:none;width:100%}
.hint{font-size:15px;color:var(--ink3);margin:0 0 10px}
.group{background:var(--group);border-radius:var(--r-group);overflow:hidden;transition:box-shadow var(--t-ui) ease}
.row{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 18px;cursor:pointer;position:relative;font-size:17.5px;line-height:1.4;transition:background var(--t-hover) ease;-webkit-tap-highlight-color:transparent}
.row+.row::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;height:1px;background:var(--sep)}
.row:hover{background:#F8F9FD}
.row .in{display:flex;align-items:center;gap:14px;flex:1;min-width:0;transition:transform var(--t-press) var(--ease-out)}
.row:active .in{transform:scale(.985)}
.row input{position:absolute;opacity:0;pointer-events:none}
.row .txt{flex:1;min-width:0;transition:color var(--t-hover) ease}
.row .mk{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:50%;transition:background var(--t-ui) var(--ease-out),border-color var(--t-ui) ease,transform var(--t-ui) var(--ease-out)}
.row .mk svg{width:16px;height:16px}
.row .mk path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .32s var(--ease-out) .05s}
.row input:checked~.in .mk path{stroke-dashoffset:0}
.row.single .mk{border:2px solid #C3C7D9}
.row.single input:checked~.in .mk{background:var(--gold);border-color:var(--gold)}
.row.single .mk svg{color:var(--navy)}
.row.multi .mk{border-radius:8px;border:2px solid #C3C7D9}
.row.multi input:checked~.in .mk{background:var(--navy);border-color:var(--navy)}
.row.multi .mk svg{color:#fff}
.row input:checked~.in .txt{font-weight:800;color:var(--navy)}
.row:has(input:checked){background:#F6F7FC}
.row:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:-3px}
.row.off{cursor:not-allowed}.row.off .txt{color:var(--ink3)}
.row.bump .mk,.row.bump .rkn{animation:bump .34s var(--ease-out)}
/* rank: tap in order */
button.row{width:100%;border:0;background:transparent;text-align:start;font:inherit;color:inherit}
.row.rk .rkn{width:30px;height:30px;flex:none;border-radius:50%;border:2px dashed #C3C7D9;display:grid;place-items:center;font-weight:900;font-size:15px;transition:background var(--t-ui) var(--ease-out),border-color var(--t-ui) ease,color var(--t-ui) ease}
.row.rk.on .rkn{background:var(--navy);border:2px solid var(--navy);color:#fff}
.row.rk.on .txt{font-weight:800;color:var(--navy)}
.row.rk.on{background:#F6F7FC}
.link{border:0;background:transparent;color:var(--navy);font-weight:800;font-size:15px;min-height:44px;padding:0 4px;cursor:pointer;margin-top:4px}
/* number */
.numrow{display:flex;align-items:center;gap:10px;padding-inline-end:18px}
.numrow input{flex:1;font-size:22px!important;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
[dir="rtl"] .numrow input{text-align:right}
.numrow input:disabled{background:transparent;opacity:.5}
.numrow .unit{color:var(--ink3);font-weight:700;white-space:nowrap}
.group .row.sub{border-top:1px solid var(--sep)}
/* scale grid */
.group.scale{padding:6px 0}
.sc-key{direction:ltr;display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--ink3);padding:8px 18px 4px}
.sc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 18px;position:relative}
.sc-row+.sc-row::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;height:1px;background:var(--sep)}
.sc-lbl{font-size:17px;line-height:1.35}
.sc-btns{display:flex;gap:6px;direction:ltr}
.sc-btns button{width:44px;height:44px;border-radius:12px;border:2px solid var(--sep);background:var(--group);font-weight:800;font-size:16px;cursor:pointer;color:var(--ink2);transition:background var(--t-ui) var(--ease-out),border-color var(--t-ui) ease,color var(--t-ui) ease}
.sc-btns button:hover{border-color:#C3C7D9}
.sc-btns button.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.sc-btns button.pop{animation:bump .34s var(--ease-out)}
@keyframes bump{40%{transform:scale(.82)}100%{transform:scale(1)}}
.group textarea,.group input[type=text]{display:block;width:100%;border:0;background:transparent;padding:14px 18px;font-size:17.5px;line-height:1.55;resize:vertical}
.group textarea{min-height:120px}
.group textarea:focus,.group input[type=text]:focus{outline:none}
.group:has(textarea:focus,input[type=text]:focus){box-shadow:0 0 0 3px rgba(234,169,24,.6)}
.group .sub{border-top:1px solid var(--sep)}
.fieldlbl{display:block;font-size:15px;font-weight:700;color:var(--ink2);padding:12px 18px 0}
.req{color:var(--err)}
.reveal>*{opacity:0;transform:translateY(18px);animation:fadeup .62s var(--ease-out) forwards}
.reveal>*:nth-child(1){animation-delay:.04s}.reveal>*:nth-child(2){animation-delay:.11s}.reveal>*:nth-child(3){animation-delay:.18s}.reveal>*:nth-child(4){animation-delay:.25s}.reveal>*:nth-child(5){animation-delay:.32s}.reveal>*:nth-child(6){animation-delay:.39s}.reveal>*:nth-child(7){animation-delay:.46s}.reveal>*:nth-child(n+8){animation-delay:.5s}

/* screen transitions (direction-aware) */
.screen.leave{opacity:0;transform:translateX(var(--lx,0));transition:opacity .14s var(--ease-exit),transform .14s var(--ease-exit)}
.screen.in-f{animation:inF .5s var(--ease-expo)}
.screen.in-b{animation:inB .5s var(--ease-expo)}
@keyframes inF{from{opacity:0;transform:translateX(var(--fx,-28px))}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(var(--bx,28px))}to{opacity:1;transform:none}}
[dir="ltr"] .screen{--fx:28px;--bx:-28px}

/* ---------- actions ---------- */
.actions{display:flex;gap:12px;align-items:center;margin-top:10px}
.btn{border:0;border-radius:var(--r-btn);min-height:52px;padding:0 28px;font-size:17.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background var(--t-hover) ease,transform var(--t-press) var(--ease-out)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.p{background:var(--navy);color:#fff}
@media (hover:hover){.btn.p:hover:not(:disabled){background:var(--navy-press)}}
.btn.g{background:var(--gold);color:var(--navy)}
.btn.p:disabled{background:#C9CDE0;color:#fff;cursor:not-allowed}
.btn.t{background:transparent;color:var(--navy)}
.btn.t:hover{background:var(--sel)}
.btn svg{width:18px;height:18px}
[dir="rtl"] .flip{transform:scaleX(-1)}
.bottombar{display:none}
.status{font-size:16px;font-weight:700;margin-top:14px;min-height:1.5em}
.status.bad{color:var(--err)}

/* ---------- review ---------- */
.rv-sec{margin-bottom:26px}
.rv-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.rv-head h2{font-size:21px;margin:0}
.rv-head button{border:0;background:transparent;color:var(--navy);font-weight:800;font-size:16px;min-height:44px;padding:0 8px;border-radius:10px;cursor:pointer}
.rv-head button:hover{background:var(--sel)}
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 22px;padding:12px 18px;position:relative;font-size:16px}
.rv+.rv::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;height:1px;background:var(--sep)}
.rv .k{color:var(--ink2)}
.rv .v{font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.rv .v.none{color:var(--ink3);font-weight:400}
.missing{background:#FFF4D6;color:var(--gold-ink);border-radius:14px;padding:12px 16px;font-size:16px;font-weight:600;margin-bottom:24px}
.ring{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.ring svg{width:70px;height:70px;transform:rotate(-90deg)}
.ring circle.f{transition:stroke-dashoffset 1s var(--ease-expo)}
.ring b{font-size:22px}
.ring span{display:block;color:var(--ink2);font-size:15px}

/* ---------- finale ---------- */
.finale{text-align:center;padding:64px 28px 120px}
.finale .logo-draw{width:min(80%,380px);margin-inline:auto}
.finale h1{font-size:clamp(34px,4vw,52px);font-weight:900;margin:26px 0 8px;opacity:0;animation:fadeup .8s var(--ease-out) 1.5s forwards}
.finale p{color:#D7DCF2;font-size:19px;max-width:48ch;margin:0 auto 26px;opacity:0;animation:fadeup .8s var(--ease-out) 1.65s forwards}
.finale .btn{opacity:0;animation:fadeup .8s var(--ease-out) 1.8s forwards}

.foot{max-width:1200px;margin:0 auto;padding:6px 20px 40px;color:var(--ink3);font-size:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.foot img{height:24px;opacity:.85}
#printView{display:none}

/* ---------- phone ---------- */
@media (max-width:900px){
  .sc-row{grid-template-columns:1fr}.sc-btns button{flex:1;width:auto}
  .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-block:16px 130px;padding-inline:16px}
  .layout.wide{padding-block:12px 120px}
  .journey{display:none}
  .jmini{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:20;background:var(--ground);padding:12px 22px 10px}
  .jmini .track{position:relative;margin-inline:10px;height:16px;display:flex;align-items:center;justify-content:space-between}
  .jmini .track::before{content:"";position:absolute;inset-inline:0;top:50%;height:3px;margin-top:-1.5px;background:var(--sep);border-radius:2px}
  .jmini .fill{position:absolute;inset-inline-start:0;top:50%;height:3px;margin-top:-1.5px;background:var(--gold);border-radius:2px;transition:width .7s var(--ease-io)}

    h=`<section class="stage"><div class="pat"></div><div class="welcome">
        <div><div class="tag">${tr("tag")}</div><h1><span class="line"><span>${tr("t1")}</span></span><span class="line"><span>${tr("t2")}</span></span></h1>
        <p class="lede">${tr("lede")}</p><div class="facts"><span class="fact">${tr("f1",{n:ALLQ.length})}</span><span class="fact">${tr("f2")}</span><span class="fact">${tr("f3")}</span></div></div>
        <div class="logo-stage">${logoDraw()}</div>
      </div>${pathLine()}</section>
      <div class="start-card"><h2>${tr("you")}</h2><p class="hint">${tr("youHint")}</p><div class="group">
        <label class="fieldlbl" for="r_name">${tr("name")} <span class="req" aria-hidden="true">*</span></label><input type="text" id="r_name" autocomplete="name" required value="${esc(st.name||"")}">
        <div class="sub"><label class="fieldlbl" for="r_role">${tr("role")}</label><input type="text" id="r_role" placeholder="${esc(tr("roleph"))}" value="${esc(st.role||"")}"></div></div>
        <div style="margin-top:16px">${n.inline}</div></div>`;
  }else if(st.step===LAST){
    const a=nAns(),miss=ALLQ.length-a;n=nav(tr("send"),"send",false);const C=2*Math.PI*30;
    h=`<h1 class="plain">${tr("review")}</h1><p class="lede2">${tr("reviewLede")}</p>
      <div class="ring"><svg viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="35" r="30" fill="none" stroke="#E3E5EE" stroke-width="7"/><circle class="f" cx="35" cy="35" r="30" fill="none" stroke="#EAA918" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C*(1-a/ALLQ.length)}"/></svg><div><b>${tr("ringT",{a,b:ALLQ.length})}</b><span>${tr("ringS")}</span></div></div>
      ${miss?`<div class="missing">${tr("missing",{n:miss})}</div>`:""}<div class="reveal">`;
    h+=`<div class="rv-sec"><div class="rv-head"><h2>${tr("you2")}</h2><button type="button" data-go="0">${tr("edit")}</button></div><div class="group"><div class="rv"><div class="k">${tr("name")}</div><div class="v">${esc(st.name||"")}</div></div><div class="rv"><div class="k">${tr("role")}</div><div class="v ${st.role?"":"none"}">${esc(st.role||tr("noAns"))}</div></div></div></div>`;
    SECS.forEach((s,i)=>{h+=`<div class="rv-sec"><div class="rv-head"><h2>${esc(s.t[L])}</h2><button type="button" data-go="${i+1}">${tr("edit")}</button></div><div class="group">`+s.q.map(q=>{const x=ansText(q,st.a);return `<div class="rv"><div class="k">${esc(q.t[L])}</div><div class="v ${x?"":"none"}">${esc(x||tr("noAns"))}</div></div>`}).join("")+`</div></div>`});
    h+=`</div>`+n.inline+`<p class="status" id="status" role="status" aria-live="polite"></p>`;
  }else{
    const s=SECS[st.step-1];n=nav(st.step===SECS.length?tr("toReview"):tr("next"),"next",false);
    const d=secDone(st.step),tot=s.q.length;
    h=`<header class="chapter"><div class="pat"></div><div class="k">${tr("stop",{a:st.step,b:SECS.length})}</div><h1>${esc(s.t[L])}</h1><p>${esc(s.w[L])}</p><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${d}" aria-label="${esc(tr("secOf",{a:d,b:tot}))}"><i style="width:${d/tot*100}%"></i></div></header><div class="reveal">`+s.q.map(qBlock).join("")+`</div>`+n.inline;
  }
  if(!done){sc.innerHTML=h;$("#bottombar").hidden=false;$("#bottombar").innerHTML=n.bar;wire()}
  sc.classList.remove("leave","in-f","in-b");sc.style.removeProperty("--lx");
  if(dir){void sc.offsetWidth;sc.classList.add(dir>0?"in-f":"in-b")}
  const ring=$(".ring circle.f");if(ring)requestAnimationFrame(()=>requestAnimationFrame(()=>{ring.style.strokeDashoffset=ring.dataset.to}));
}
function ansText(q,a){const v=a[q.id];let s="";
  if(q.type==="single")s=v!=null&&q.o[v]?q.o[v][L]:"";
  else if(q.type==="multi")s=Array.isArray(v)?v.map(i=>q.o[i]&&q.o[i][L]).filter(Boolean).join(L?"، ":", "):"";
  else if(q.type==="rank")s=Array.isArray(v)?v.map((i,k)=>(k+1)+". "+(q.o[i]?q.o[i][L]:"")).join(L?"، ":", "):"";
  else if(q.type==="number")s=v==="dk"?tr("dk"):typeof v==="number"?fmtN(v)+(q.unit?" "+q.unit[L]:""):"";
  else if(q.type==="scale")s=v&&typeof v==="object"?q.items.map((it,i)=>v[i]?it[L]+": "+v[i]:"").filter(Boolean).join(L?"، ":", "):"";
  else s=v||"";
  if(q.comment&&a[q.id+"_c"])s+=(s?" — ":"")+a[q.id+"_c"];return s}
function tick(){if(navigator.vibrate&&!RM)try{navigator.vibrate(8)}catch(e){}}
function secBar(){const s=SECS[st.step-1];if(!s)return;const b=$(".chapter .bar i");if(b)b.style.width=(secDone(st.step)/s.q.length*100)+"%";
  const pb=$(".chapter .bar");if(pb){pb.setAttribute("aria-valuenow",secDone(st.step));pb.setAttribute("aria-label",tr("secOf",{a:secDone(st.step),b:s.q.length}))}}
function changed(){save();journey();secBar()}
function wire(){
  document.querySelectorAll("[data-nav=back]").forEach(b=>b.onclick=()=>go(st.step-1));
  document.querySelectorAll("#screen [data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  ["next","next2"].forEach(id=>{const b=$("#"+id);if(b)b.onclick=()=>go(st.step+1)});
  ["send","send2"].forEach(id=>{const b=$("#"+id);if(b)b.onclick=submit});
  const nm=$("#r_name");if(nm){nm.addEventListener("input",()=>{st.name=nm.value;save();const ok=!!nm.value.trim();["next","next2"].forEach(id=>{const b=$("#"+id);if(b)b.disabled=!ok});journey()});
    nm.addEventListener("keydown",e=>{if(e.key==="Enter"&&nm.value.trim())go(1)});
    $("#r_role").addEventListener("input",e=>{st.role=e.target.value;save()});}
  if(st.step>=1&&st.step<=SECS.length)SECS[st.step-1].q.forEach(q=>{
    if(q.comment&&q.o&&q.type!=="rank")$(`#f_${q.id}_c`).addEventListener("input",e=>{st.a[q.id+"_c"]=e.target.value;save()});
    if(q.type==="single")document.querySelectorAll(`input[name="f_${q.id}"]`).forEach(r=>r.addEventListener("change",()=>{st.a[q.id]=+r.value;bump(r);changed()}));
    else if(q.type==="rank"){const g=$(`#g_${q.id}`);
      const redraw=()=>{g.innerHTML=rankRows(q);hook()};
      const hook=()=>g.querySelectorAll("[data-rk]").forEach(b=>b.onclick=()=>{const i=+b.dataset.rk;let v=Array.isArray(st.a[q.id])?st.a[q.id].slice():[];
        const p=v.indexOf(i);if(p>=0)v.splice(p,1);else v.push(i);st.a[q.id]=v;redraw();const nb=g.querySelector(`[data-rk="${i}"]`);if(nb){nb.focus();bump(nb)}changed()});
      hook();const c=$(`[data-rkclear="${q.id}"]`);if(c)c.onclick=()=>{st.a[q.id]=[];redraw();changed()}}
    else if(q.type==="number"){const inp=$(`#f_${q.id}`),dk=$(`#f_${q.id}_dk`);
      inp.addEventListener("input",()=>{const n=toNum(inp.value);if(n==null)delete st.a[q.id];else st.a[q.id]=n;changed()});
      inp.addEventListener("blur",()=>{if(typeof st.a[q.id]==="number")inp.value=fmtN(st.a[q.id])});
      dk.addEventListener("change",()=>{if(dk.checked){st.a[q.id]="dk";inp.value="";inp.disabled=true}else{delete st.a[q.id];inp.disabled=false;inp.focus()}bump(dk);changed()})}
    else if(q.type==="scale")document.querySelectorAll(`[data-q="${q.id}"] [data-sc]`).forEach(b=>b.onclick=()=>{const i=+b.dataset.sc,n=+b.dataset.n;const v=Object.assign({},st.a[q.id]||{});
      if(v[i]===n)delete v[i];else v[i]=n;st.a[q.id]=v;b.parentNode.querySelectorAll("button").forEach(x=>{const on=v[i]===+x.dataset.n;x.classList.toggle("on",on);x.setAttribute("aria-checked",on)});
      b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");tick();changed()});
    else if(q.type==="multi"){const bx=[...document.querySelectorAll(`input[name="f_${q.id}"]`)];
      const sync=()=>{if(!q.max)return;const c=bx.filter(b=>b.checked).length;bx.forEach(b=>{const lim=!b.checked&&c>=q.max;b.disabled=lim;b.closest(".row").classList.toggle("off",lim)})};
      bx.forEach(b=>b.addEventListener("change",()=>{st.a[q.id]=bx.filter(x=>x.checked).map(x=>+x.value);sync();bump(b);changed()}));sync();}
    else $(`#f_${q.id}`).addEventListener("input",e=>{st.a[q.id]=e.target.value;changed()});
  });
}
function bump(inp){const r=inp.closest(".row");if(!r)return;r.classList.remove("bump");void r.offsetWidth;r.classList.add("bump");tick()}
let busy=false;
function go(i){if(busy||i<0||i>LAST||i===st.step)return;if(i>0&&!(st.name&&st.name.trim()))return;
  const dir=i>st.step?1:-1,sc=$("#screen");
  const run=()=>{st.step=i;save();render(dir);sc.focus({preventScroll:true});window.scrollTo({top:0,behavior:"auto"});busy=false};
  if(RM){run();return}
  busy=true;sc.style.setProperty("--lx",((L?28:-28)*dir)+"px");sc.classList.add("leave");setTimeout(run,150)}

/* print */
function buildPrint(blank,a,meta){
  const d=blank?"":new Date().toISOString().slice(0,10);
  let h=`<div class="ph"><img src="assets/horiz.png" alt=""><div class="t">${tr("title")}</div></div>
   <div class="pmeta"><div><div class="pl">${tr("name")}</div><div class="pline">${blank?"":esc(meta.name)}</div></div><div><div class="pl">${tr("role")}</div><div class="pline">${blank?"":esc(meta.role)}</div></div><div><div class="pl">${tr("date")}</div><div class="pline">${d}</div></div></div>`;
  SECS.forEach(s=>{h+=`<div class="psec"><h2>${esc(s.t[L])}</h2>`;s.q.forEach(q=>{const v=a[q.id];let b="";
    if(q.type==="rank"){const r=Array.isArray(v)?v:[];b=`<p class="ph2">${tr("printRank")}</p><div class="popts">`+q.o.map((o,i)=>{const p=blank?-1:r.indexOf(i);return `<div class="popt"><span class="pbox n">${p>=0?p+1:""}</span><span>${esc(o[L])}</span></div>`}).join("")+`</div>`}
    else if(q.type==="number")b=`<div class="ptxt">${blank?"":esc(v==="dk"?tr("dk"):fmtN(v))} <span class="pl">${q.unit?esc(q.unit[L]):""}</span></div>`;
    else if(q.type==="scale"){const r=v||{};b=`<p class="ph2">${tr("printScale")}</p><table class="pscale">`+q.items.map((it,i)=>`<tr><td>${esc(it[L])}</td>${[1,2,3,4,5].map(n=>`<td class="c"><span class="pdot ${!blank&&r[i]===n?"on":""}">${n}</span></td>`).join("")}</tr>`).join("")+`</table>`}
    else if(q.o){const hint=/[(（]/.test(q.t[L])?"":q.type==="single"?tr("choose"):(q.max?tr("upTo",{n:q.max}):tr("chooseMany"));
      b=`${hint?`<p class="ph2">${hint}</p>`:""}<div class="popts">`+q.o.map((o,i)=>{const on=!blank&&(q.type==="single"?v===i:(Array.isArray(v)&&v.includes(i)));return `<div class="popt"><span class="pbox ${q.type==="single"?"c":""} ${on?"on":""}"></span><span>${esc(o[L])}</span></div>`}).join("")+`</div>`;
      if(q.comment)b+=`<div class="ptxt" style="margin-top:4px">${blank?"":esc(a[q.id+"_c"]||"")}</div>`}
    else b=`<div class="ptxt ${q.type==="text"?"big":""}">${blank?"":esc(v||"")}</div>`;
    h+=`<div class="pq"><p class="qt"><i>${q.id}</i><span>${esc(q.t[L])}</span></p>${b}</div>`});h+=`</div>`});
  return h+`<div class="pfoot">${tr("pfoot")}</div>`;
}
const srcData=()=>done&&lastSent?lastSent:{name:st.name,role:st.role,answers:st.a};
function doPrint(blank){closeMenu();const s=srcData();$("#printView").innerHTML=buildPrint(blank,s.answers,s);setTimeout(()=>window.print(),80)}
window.addEventListener("beforeprint",()=>{if(!$("#printView").innerHTML){const s=srcData();$("#printView").innerHTML=buildPrint(false,s.answers,s)}});
window.addEventListener("afterprint",()=>{$("#printView").innerHTML=""});
function openMenu(){const m=$("#menu");m.innerHTML=`<button type="button" role="menuitem" id="pm1"><span>${tr("printMine")}<small>${tr("printMineS")}</small></span></button><button type="button" role="menuitem" id="pm2"><span>${tr("printBlank")}<small>${tr("printBlankS")}</small></span></button>`;
  m.hidden=false;$("#printBtn").setAttribute("aria-expanded","true");$("#pm1").onclick=()=>doPrint(false);$("#pm2").onclick=()=>doPrint(true);$("#pm1").focus()}
function closeMenu(){$("#menu").hidden=true;$("#printBtn").setAttribute("aria-expanded","false")}
$("#printBtn").onclick=e=>{e.stopPropagation();$("#menu").hidden?openMenu():closeMenu()};
document.addEventListener("click",e=>{if(!$("#menu").hidden&&!$("#menu").contains(e.target))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#menu").hidden){closeMenu();$("#printBtn").focus()}});

/* send */
function readable(){const o={};ALLQ.forEach(q=>{const v=st.a[q.id];let s="";
  if(q.type==="single")s=v!=null&&q.o[v]?q.o[v][0]:"";else if(q.type==="multi")s=Array.isArray(v)?v.map(i=>q.o[i]&&q.o[i][0]).filter(Boolean).join("; "):"";
  else if(q.type==="rank")s=Array.isArray(v)?v.map((i,k)=>(k+1)+". "+(q.o[i]?q.o[i][0]:"")).join("; "):"";
  else if(q.type==="number")s=v==="dk"?"Don't know":typeof v==="number"?String(v):"";
  else if(q.type==="scale")s=v&&typeof v==="object"?q.items.map((it,i)=>v[i]?it[0]+": "+v[i]:"").filter(Boolean).join("; "):"";
  else s=v||"";
  if(q.comment&&st.a[q.id+"_c"])s+=(s?" | ":"")+"Details: "+st.a[q.id+"_c"];o[q.id]=s});return o}
async function post(ep,body){
  try{const r=await fetch(ep,{method:"POST",body,headers:{"Content-Type":"text/plain;charset=utf-8"}});let j=null;try{j=await r.json()}catch(e){}
    if(j&&j.ok===false)return false;return r.ok||!!(j&&j.ok)}
  catch(e){try{await fetch(ep,{method:"POST",mode:"no-cors",body,headers:{"Content-Type":"text/plain;charset=utf-8"}});return true}catch(e2){return false}}}
async function submit(){
  if(sending)return;const s=$("#status");s.className="status";
  if(!CFG.endpoint){s.className="status bad";s.textContent=tr("notConnected");return}
  st.sid=st.sid||((crypto.randomUUID&&crypto.randomUUID())||(Date.now().toString(36)+Math.random().toString(36).slice(2)));save();
  const p={id:st.sid,version:SV.version,submittedAt:new Date().toISOString(),name:(st.name||"").trim(),role:(st.role||"").trim(),lang:L?"ar":"en",answers:st.a,readable:readable(),cols:ALLQ.map(q=>[q.id,q.id+" · "+q.label])};
  sending=true;["send","send2"].forEach(id=>{const b=$("#"+id);if(b){b.disabled=true;b.textContent=tr("sending")}});
  const ok=await post(CFG.endpoint,JSON.stringify(p));sending=false;
  if(ok){lastSent=p;done=true;try{localStorage.removeItem(KEY)}catch(e){};st={lang:st.lang,a:{},step:0};render(1);window.scrollTo(0,0);tick()}
  else{["send","send2"].forEach(id=>{const b=$("#"+id);if(b){b.disabled=false;b.textContent=tr("send")}});s.className="status bad";s.textContent=tr("fail")}
}
function setLang(l){if(st.lang===l)return;st.lang=l;L=l==="ar"?1:0;save();render(0)}
$("#lang_ar").onclick=()=>setLang("ar");$("#lang_en").onclick=()=>setLang("en");
if(st.step>0&&!(st.name&&st.name.trim()))st.step=0;
render(0);
})();
</script>
